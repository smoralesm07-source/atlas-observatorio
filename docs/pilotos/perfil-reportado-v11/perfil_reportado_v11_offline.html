<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src 'none'; connect-src 'none'; object-src 'none'; frame-src 'none'; media-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'">
<title>Perfil del Reportado</title>
<style>
/* Concepto: rail de navegación · expediente vivo (izq.) + radar de alertas fijo (der.).
   La severidad ordena la lectura: forma + color + texto, nunca solo color. */
:root{
  --bg:#edf0f4;--surface:#ffffff;--surface-2:#f6f8fb;--surface-3:#e7ebf1;
  --line:#dbe1e9;--line-2:#c3ccd8;
  --ink:#0d1421;--ink-2:#364256;--ink-3:#556275;--ink-4:#8a95a6;
  --accent:#2f54eb;--accent-hover:#2344cf;--on-accent:#ffffff;
  --crit:#cf2338;--high:#c24a08;--med:#946200;--low:#0e7c86;--none:#687588;--ok:#1b7a52;
  --scrim:rgb(9 14 24 / .45);
  --shadow:0 1px 2px rgb(15 23 42 / .05),0 6px 18px rgb(15 23 42 / .06);
  --shadow-pop:0 24px 64px rgb(15 23 42 / .24),0 2px 6px rgb(15 23 42 / .08);
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:ui-sans-serif,system-ui,-apple-system,"Segoe UI Variable Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --top:58px;
  --accent-soft:color-mix(in srgb,var(--accent) 11%,var(--surface));
  --accent-mid:color-mix(in srgb,var(--accent) 38%,var(--surface));
  --crit-soft:color-mix(in srgb,var(--crit) 11%,var(--surface));
  --high-soft:color-mix(in srgb,var(--high) 11%,var(--surface));
  --med-soft:color-mix(in srgb,var(--med) 13%,var(--surface));
  --low-soft:color-mix(in srgb,var(--low) 11%,var(--surface));
  --none-soft:color-mix(in srgb,var(--none) 11%,var(--surface));
  --ok-soft:color-mix(in srgb,var(--ok) 12%,var(--surface));
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#090d14;--surface:#10161f;--surface-2:#151c27;--surface-3:#1d2634;
  --line:#222c3b;--line-2:#303c4f;
  --ink:#e9eef6;--ink-2:#b5bfcf;--ink-3:#8c98aa;--ink-4:#5f6b7e;
  --accent:#7d95ff;--accent-hover:#9aacff;--on-accent:#0a0f1a;
  --crit:#ff5d70;--high:#ff8c47;--med:#f1c24f;--low:#3cc3cb;--none:#8592a5;--ok:#43c38b;
  --scrim:rgb(0 0 0 / .62);
  --shadow:0 1px 2px rgb(0 0 0 / .4),0 8px 24px rgb(0 0 0 / .28);
  --shadow-pop:0 24px 64px rgb(0 0 0 / .6),0 2px 6px rgb(0 0 0 / .4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#090d14;--surface:#10161f;--surface-2:#151c27;--surface-3:#1d2634;
  --line:#222c3b;--line-2:#303c4f;
  --ink:#e9eef6;--ink-2:#b5bfcf;--ink-3:#8c98aa;--ink-4:#5f6b7e;
  --accent:#7d95ff;--accent-hover:#9aacff;--on-accent:#0a0f1a;
  --crit:#ff5d70;--high:#ff8c47;--med:#f1c24f;--low:#3cc3cb;--none:#8592a5;--ok:#43c38b;
  --scrim:rgb(0 0 0 / .62);
  --shadow:0 1px 2px rgb(0 0 0 / .4),0 8px 24px rgb(0 0 0 / .28);
  --shadow-pop:0 24px 64px rgb(0 0 0 / .6),0 2px 6px rgb(0 0 0 / .4);
  color-scheme:dark;
}

/* ── base */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,p,figure,dl,dd{margin:0}
h1,h2,h3{text-wrap:balance}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:disabled{cursor:not-allowed;opacity:.42}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.g{flex:none;display:inline-block}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.94em;letter-spacing:-.01em}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
kbd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--surface-2);color:var(--ink-3);font:600 11px/1 var(--mono)}

.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:var(--line-2);background:var(--surface-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn-sm{height:28px;padding:0 9px;font-size:12px;gap:5px}
.btn kbd{height:18px;min-width:18px;font-size:10.5px}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;color:var(--ink-2);border:1px solid transparent;flex:none}
.icon-btn:hover{background:var(--surface);border-color:var(--line);color:var(--ink)}
.icon-btn .i{width:19px;height:19px}
.lvl{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 8px;border-radius:999px;font-size:12px;font-weight:700;color:var(--c);background:var(--cs);white-space:nowrap}
.lvl b{font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:650;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.hi{background:var(--high-soft);color:var(--high)}
.pill.ac{background:var(--accent-soft);color:var(--accent)}
.pill.dk{background:var(--ink);color:var(--bg)}
.cnt{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:var(--surface-3);color:var(--ink-2);font:700 11.5px/1 var(--sans);font-variant-numeric:tabular-nums}
.kicker{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}

/* ── shell */
.app{display:grid;grid-template-columns:76px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;gap:16px;padding:12px 8px;background:var(--surface);border-right:1px solid var(--line);z-index:30}
.brand{width:40px;height:40px;flex:none;display:block}
.nav{display:flex;flex-direction:column;gap:4px;width:100%}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px 8px;border-radius:12px;color:var(--ink-3);font-size:11.5px;font-weight:650}
.nav button .i{width:21px;height:21px}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav-badge{position:absolute;top:3px;right:8px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--high);color:var(--surface);font:700 10.5px/18px var(--sans);text-align:center;font-style:normal}
.nav-dot{position:absolute;top:7px;right:17px;width:9px;height:9px;border-radius:50%;background:var(--med);box-shadow:0 0 0 2px var(--surface)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;height:var(--top);display:flex;align-items:center;gap:16px;padding:0 24px;background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.brand-sm{display:none;width:34px;height:34px}
.appname{display:flex;flex-direction:column;line-height:1.25;min-width:0;flex:none}
.appname b{font-size:14px;font-weight:700;letter-spacing:-.01em}
.appname span{font-size:11.5px;color:var(--ink-3)}
.search-trigger{flex:1;min-width:0;max-width:600px;margin:0 auto;display:flex;align-items:center;gap:10px;height:40px;padding:0 8px 0 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink-3);box-shadow:var(--shadow)}
.search-trigger:hover{border-color:var(--line-2);color:var(--ink-2)}
.search-trigger>span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.search-trigger .i{width:18px;height:18px}
.top-right{display:flex;align-items:center;gap:4px;flex:none}
.corte{display:flex;align-items:center;gap:7px;margin-right:8px;font-size:12px;color:var(--ink-3);white-space:nowrap}
.corte b{color:var(--ink-2);font-weight:650;font-variant-numeric:tabular-nums}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.demo{margin-right:6px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--med);background:var(--med-soft);padding:4px 9px;border-radius:999px;white-space:nowrap}
.content{width:100%;max-width:1560px;margin:0 auto;padding:22px 28px 64px}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:6px 18px}

/* ── perfil */
.bnav{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;margin-bottom:16px;padding:8px 10px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
.bnav-mid{display:flex;align-items:center;gap:12px;flex:1;min-width:0;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.bnav-dots{display:flex;gap:5px;flex-wrap:wrap}
.bdot{width:15px;height:15px;border-radius:4px;background:var(--c)}
.bdot.cur{outline:2px solid var(--ink);outline-offset:2px}
.bnav-btns{display:flex;gap:6px}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 348px;grid-template-areas:"head radar" "tiles radar" "body radar";column-gap:22px;row-gap:16px;align-items:start}
.idhead{grid-area:head;display:flex;gap:18px;align-items:flex-start;padding:4px 2px 2px;min-width:0}
.id-body{min-width:0;flex:1}
.mono-tile{flex:none;width:60px;height:60px;display:grid;place-items:center;border-radius:16px;background:var(--ink);color:var(--bg);font:700 20px/1 var(--sans);letter-spacing:.02em}
.mono-tile.pn{border-radius:50%}
.mono-tile.sm{width:34px;height:34px;font-size:12.5px;border-radius:10px}
.mono-tile.sm.pn{border-radius:50%}
.id-kicker{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3);font-weight:650}
.tag-demo{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);border:1px dashed var(--line-2);border-radius:999px;padding:1px 8px}
.id-name{margin:5px 0 9px;font:750 30px/1.12 var(--display);letter-spacing:-.022em;overflow-wrap:anywhere}
.id-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;font-size:13px;color:var(--ink-2)}
.rut{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:650 14px var(--mono);color:var(--ink)}
.rut .i{color:var(--ink-3);width:15px;height:15px}
.rut:hover{border-color:var(--accent)}
.meta-item{display:inline-flex;align-items:center;gap:6px}
.meta-item .i{color:var(--ink-4)}
.id-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

.tiles{grid-area:tiles;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;gap:2px;min-width:0;padding:13px 14px 11px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);text-align:left;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--line-2);transform:translateY(-1px)}
.tile.has-sev{border-color:color-mix(in srgb,var(--c) 42%,var(--line))}
.tile-top{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:650;color:var(--ink-3);min-width:0}
.tile-top .i{width:15px;height:15px}
.tile-sev{margin-left:auto;display:inline-flex;align-items:center;gap:5px;color:var(--c);font-size:11.5px;font-weight:700;white-space:nowrap}
.tile-val{margin-top:4px;font:720 26px/1.1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile-cap{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-viz{display:block;height:30px;margin-top:8px}
.tviz{display:block;height:30px}
.pips{display:flex;align-items:center;gap:5px;height:30px;flex-wrap:wrap;overflow:hidden}
.pip{width:12px;height:12px;border-radius:50%;background:var(--c,var(--ink-4));flex:none}
.pip.hollow{background:transparent;box-shadow:inset 0 0 0 2px var(--c,var(--ink-4))}
.pip.sq{border-radius:3px}

.radar{grid-area:radar;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top) + 14px);max-height:calc(100vh - var(--top) - 28px);overflow:auto;overscroll-behavior:contain;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px}
.radar-score{display:flex;flex-direction:column;align-items:center}
.gauge{width:100%;max-width:236px;height:auto;display:block}
.g-num{fill:var(--ink);font:800 44px/1 var(--display);letter-spacing:-.03em}
.g-cap{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:2px}
.g-k{font-size:11.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
.g-note{margin-top:10px;font-size:12px;color:var(--ink-3);text-align:center;line-height:1.45;max-width:36ch}
.radar-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 8px;padding-top:14px;border-top:1px solid var(--line)}
.radar-head h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.rev-prog{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);font-weight:600}
.sevstrip{display:flex;height:6px;border-radius:99px;overflow:hidden;gap:2px;margin-bottom:10px}
.sevstrip i{background:var(--c)}
.alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.al{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
.al:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.al.active{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 20%,transparent)}
.al-main{display:flex;flex-direction:column;gap:3px;width:100%;padding:11px 12px 38px;border-radius:12px}
.al-top{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--c)}
.al-cat{color:var(--ink-3);font-weight:600}
.al-w{margin-left:auto;font:700 11px var(--mono);color:var(--ink-3)}
.al-title{font-size:13.5px;font-weight:650;line-height:1.35;color:var(--ink)}
.al-detail{font-size:12px;color:var(--ink-2);line-height:1.45}
.al-rule{font-size:11.5px;color:var(--ink-3);line-height:1.4}
.al-go{position:absolute;left:12px;bottom:10px;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;color:var(--accent);pointer-events:none}
.al-go .i{width:14px;height:14px}
.al-check{position:absolute;right:10px;bottom:7px;display:inline-flex;align-items:center;gap:6px;padding:3px 4px;font-size:12px;color:var(--ink-3);cursor:pointer;border-radius:6px}
.al-check input{accent-color:var(--accent);width:15px;height:15px;margin:0;cursor:pointer}
.al.done .al-title{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-4)}
.al.done .al-detail,.al.done .al-top{opacity:.65}
.empty-sm{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--surface-2);font-size:12.5px;color:var(--ink-2)}
.empty-sm .g{margin-top:4px}
.cov{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:12.5px;color:var(--ink-2)}
.cov:hover{border-color:var(--line-2);background:var(--surface-2)}
.cov-marks{display:flex;gap:4px}
.cov .i{margin-left:auto;color:var(--ink-3)}
.rules{margin-top:12px;font-size:12.5px}
.rules summary{cursor:pointer;color:var(--ink-2);font-weight:650;padding:6px 2px;list-style-position:inside}
.rules table{width:100%;border-collapse:collapse;margin-top:6px}
.rules td{padding:5px 4px;border-top:1px solid var(--line);vertical-align:top;color:var(--ink-2)}
.rules td:last-child{text-align:right;font:600 12px var(--mono);color:var(--ink-3);white-space:nowrap}
.rules p{margin-top:8px;color:var(--ink-3)}

.pbody{grid-area:body;min-width:0;display:flex;flex-direction:column;gap:16px}
.secnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top));z-index:12;margin:0 -6px;padding:8px 6px;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.secnav-in{display:flex;align-items:center;gap:3px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);overflow-x:auto;scrollbar-width:none}
.secnav-in::-webkit-scrollbar{display:none}
.secnav button{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;flex:none}
.secnav button:hover{background:var(--surface-2);color:var(--ink)}
.secnav button.on{background:var(--ink);color:var(--bg)}
.secnav button.on .cnt{background:color-mix(in srgb,var(--bg) 22%,transparent);color:var(--bg)}
.secnav-score{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;margin-right:4px;border-radius:9px;background:color-mix(in srgb,var(--c) 13%,var(--surface));color:var(--c);font:750 13px var(--sans);flex:none;font-variant-numeric:tabular-nums}

.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px 22px 22px;scroll-margin-top:calc(var(--top) + 64px);min-width:0}
.sec-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;margin-bottom:16px}
.sec-title{display:flex;gap:12px;align-items:flex-start;min-width:0}
.sec-title>.i{width:20px;height:20px;margin-top:3px;color:var(--ink-3)}
.sec-title h2{font:720 18px/1.3 var(--display);letter-spacing:-.012em}
.sec-title p{margin-top:2px;font-size:13px;color:var(--ink-3)}
.sec-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sub-h{margin:22px 0 10px;font-size:13px;font-weight:700;color:var(--ink-2)}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface-3);gap:2px}
.seg button{height:28px;padding:0 11px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-3);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.chart svg{display:block;overflow:visible}
.ct{fill:var(--ink-3);font:11.5px var(--sans)}
.ct-b{fill:var(--ink-2);font:650 12px var(--sans)}
.ct-v{fill:var(--ink);font:700 12px var(--sans)}
.ct-hot{fill:var(--med);font:700 11.5px var(--sans)}
.nl{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.mk{cursor:pointer}
.mk:focus{outline:none}
.mk:focus-visible .hit{stroke:var(--ink);stroke-width:2.5}
.tl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tl-wrap>.chart{min-width:620px}
.feed{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.feed button{display:flex;gap:11px;width:100%;height:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;align-items:flex-start;text-align:left}
.feed button:hover{border-color:var(--line-2);background:var(--surface-2)}
.fi{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--surface-3);color:var(--ink-2);flex:none}
.feed b{display:block;font-size:13px;font-weight:650;line-height:1.35}
.feed small{display:block;font-size:12px;color:var(--ink-3);margin-top:1px}
.feed time{display:block;font:600 11.5px var(--mono);color:var(--ink-3);margin-bottom:1px}

.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;margin-bottom:16px}
.fig{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);min-width:0}
.fig figcaption{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:10px}
.fig figcaption .legend{margin:0;font-weight:500}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:12.5px;color:var(--ink-2)}
.hbar b{font-variant-numeric:tabular-nums}
.hbar .t{height:8px;grid-column:1/-1;border-radius:99px;background:var(--surface-3);overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--accent);border-radius:99px}

.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{position:sticky;top:0;z-index:1;background:var(--surface-2);text-align:left;font-size:11.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr[data-act]{cursor:pointer}
.tbl tbody tr[data-act]:hover td{background:var(--surface-2)}
.tbl .r{text-align:right}
.tbl .chev{color:var(--ink-4);width:32px}
.sub{display:block;font-size:11.5px;color:var(--ink-3)}
.sub.hot{color:var(--high);font-weight:650}
.folio{font:650 13px var(--mono);white-space:nowrap}
.role{display:inline-flex;height:22px;align-items:center;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:700;white-space:nowrap}
.role-R{background:var(--accent);color:var(--on-accent)}
.role-V{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent)}
.avs{display:flex;padding-left:6px}
.av{width:26px;height:26px;border-radius:50%;margin-left:-6px;border:2px solid var(--surface);background:var(--surface-3);color:var(--ink-2);font:700 10px/22px var(--sans);text-align:center}
.av.pj{border-radius:8px}
tr.is-ev td{background:var(--accent-soft)!important}
tr.is-ev td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.is-ev:not(tr){outline:2px solid var(--accent);outline-offset:2px;background-color:var(--accent-soft)}

.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.case{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;gap:11px;min-width:0}
.case.live{border-color:color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) 4%,var(--surface))}
.case-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ruc{font:650 12.5px var(--mono);color:var(--ink-2)}
.case h3{font:720 16px/1.3 var(--display);display:flex;align-items:center;gap:8px}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 14px}
.dl dt{font-size:11.5px;color:var(--ink-3);font-weight:650}
.dl dd{margin-top:1px;font-size:13px;font-weight:550}
.co{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:11px;border-top:1px dashed var(--line)}
.co-l{font-size:11.5px;color:var(--ink-3);font-weight:650;margin-right:2px}
.chip-ent{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px 0 9px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:600;background:var(--surface)}
.chip-ent:hover{border-color:var(--accent);color:var(--accent)}

.net-tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tchip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface)}
.tchip[aria-pressed="false"]{color:var(--ink-4);background:var(--surface-2);text-decoration:line-through}
.tchip svg{flex:none}
.net-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px;margin-bottom:14px}
.net-graph{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:radial-gradient(circle at 50% 46%,var(--surface-2),var(--surface) 72%)}
.net-graph>.chart{min-width:540px}
.node{cursor:pointer}
.node:focus{outline:none}
.node:focus-visible .hit{stroke:var(--accent);stroke-width:3}
.node.dim,.edge.dim{opacity:.14}
.nd{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2);min-width:0}
.nd-h{display:flex;gap:10px;align-items:center;min-width:0}
.nd-h b{display:block;font-size:14px;line-height:1.3}
.nd-rels{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.nd-rels li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start}
.nd-rels li svg{margin-top:6px}
.nd-rels b{display:block;font-size:12.5px}
.nd-rels span{color:var(--ink-3)}
.nd-marks{display:flex;gap:6px;flex-wrap:wrap}
.nd-empty{font-size:12.5px;color:var(--ink-3)}

.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.fact{background:var(--surface);padding:11px 14px;min-width:0}
.fact dt{font-size:11.5px;color:var(--ink-3);font-weight:650}
.fact dd{margin-top:3px;font-size:14px;font-weight:650}
.fact dd small{display:block;font-size:12px;font-weight:500;color:var(--ink-3)}
.spw{margin-bottom:16px}
.spw p{font-size:12.5px;color:var(--ink-3);margin-top:4px}

.srcs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:11px;min-width:0}
.srow b{font-size:13px}
.srow small{display:block;font-size:12px;color:var(--ink-3)}
.srow small.warn{color:var(--high);font-weight:600}
.sstate{font-size:12px;font-weight:650;white-space:nowrap;text-align:right}
.sstate small{font-weight:500}
.sg{width:13px;height:13px;border-radius:50%;flex:none;display:inline-block}
.sg.hit{background:var(--ink-2)}
.sg.nohit{box-shadow:inset 0 0 0 2px var(--ink-3)}
.sg.nq{border:2px dashed var(--ink-4)}
.empty{display:flex;gap:12px;align-items:center;padding:16px;border:1px dashed var(--line-2);border-radius:12px;color:var(--ink-2);font-size:13px;background:var(--surface-2)}

/* ── lote */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px}
.page-head h1{font:750 28px/1.15 var(--display);letter-spacing:-.02em}
.page-head p{margin-top:6px;max-width:72ch;color:var(--ink-3);font-size:13.5px}
.bgrid{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);gap:18px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.panel-h h2{font-size:15px;font-weight:700}
#bInput{display:block;width:100%;min-height:270px;resize:vertical;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);font:13.5px/1.7 var(--mono);color:var(--ink)}
#bInput:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.bparse{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.pchip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;background:var(--surface-3);font-size:12px;font-weight:600;color:var(--ink-2)}
.pchip.warn{background:var(--med-soft);color:var(--med)}
.pchip.info{background:var(--accent-soft);color:var(--accent)}
.bactions{display:flex;flex-wrap:wrap;gap:8px}
.issues{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.issues h3{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.issues ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.issue{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 9px;align-items:start;padding:9px 10px;border-radius:10px;background:var(--surface-2);font-size:12.5px}
.issue .g{margin-top:4px}
.issue .mono{font-weight:650;overflow-wrap:anywhere}
.issue p{grid-column:2;color:var(--ink-3)}
.issue .btn{grid-column:2;justify-self:start;margin-top:5px}
.bstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.bstat{padding:10px 12px;border:1px solid var(--line);border-radius:12px;min-width:0}
.bstat span{font-size:12px;color:var(--ink-3);font-weight:650}
.bstat b{display:block;font:720 22px/1.2 var(--display);font-variant-numeric:tabular-nums}
.dist{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);margin-bottom:14px}
.dist-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.dist-h h2{font-size:14px;font-weight:700}
.dist-bar{display:flex;height:28px;border-radius:8px;overflow:hidden;gap:2px;margin:10px 0}
.dist-bar button{background:var(--c);color:var(--surface);font:750 12.5px var(--sans);min-width:28px;transition:opacity .15s}
.dist-bar button.off{opacity:.25}
.dist-leg{display:flex;flex-wrap:wrap;gap:6px}
.lchip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.lchip[aria-pressed="true"]{border-color:var(--c);background:var(--cs);color:var(--c)}
.lchip b{font-variant-numeric:tabular-nums}
.btools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.field{display:flex;align-items:center;gap:8px;flex:1;min-width:200px;height:36px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink-3)}
.field input{border:0;outline:0;background:transparent;width:100%;font-size:13px;color:var(--ink)}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.matrix td{white-space:nowrap}
.matrix .ent{white-space:normal;min-width:170px}
.matrix .ent b{display:block;font-weight:650;font-size:13px;line-height:1.3}
.hm-c{display:inline-flex;align-items:center;gap:5px;min-width:0;height:28px;padding:0 9px;border-radius:7px;background:var(--cs);color:var(--c);font-weight:650;font-size:12.5px;font-variant-numeric:tabular-nums}
.hm-c.z{background:transparent;color:var(--ink-4);font-weight:500}
.th-sort{display:inline-flex;align-items:center;gap:4px;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit}
.th-sort .i{width:13px;height:13px;opacity:.5}
th[aria-sort] .th-sort{color:var(--ink)}
th[aria-sort] .th-sort .i{opacity:1}
.scoreb{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:650;color:var(--c)}
.scoreb .sc{width:38px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--c);color:var(--surface);font:750 13px var(--sans);font-variant-numeric:tabular-nums}
.otag{display:inline-block;font:650 11px var(--mono);padding:2px 6px;border-radius:5px;background:var(--surface-3);color:var(--ink-2);margin-right:4px}
.matrix td.topal{white-space:normal;min-width:190px;max-width:240px;font-size:12.5px;line-height:1.35;color:var(--ink-2)}
.hint{margin-top:10px;font-size:12.5px;color:var(--ink-3)}
.bempty{padding:40px 20px;text-align:center;color:var(--ink-3);border:1px dashed var(--line-2);border-radius:14px}
.bempty b{display:block;color:var(--ink-2);font-size:14px;margin-bottom:4px}

/* ── fuentes */
.src-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:18px}
.src{display:flex;flex-direction:column;gap:14px}
.src header{display:flex;gap:12px;align-items:flex-start}
.src header .fi{width:36px;height:36px;border-radius:10px}
.src h3{font-size:15px;font-weight:700}
.src header p{font-size:12.5px;color:var(--ink-3)}
.src header .pill{margin-left:auto}
.fresh-bar{position:relative;height:8px;border-radius:99px;background:var(--surface-3)}
.fresh-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--c)}
.fresh-bar .sla{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink-2);border-radius:1px}
.fresh-meta{display:flex;justify-content:space-between;gap:8px;margin-top:7px;font-size:12px;color:var(--ink-3)}
.states{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.state{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--surface-2);font-size:13px}
.state .sg{margin-top:4px}
.state b{display:block}
.state span{color:var(--ink-3);font-size:12.5px}

/* ── capas */
.overlay{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;padding:11vh 16px 16px;animation:fade .14s ease-out}
.overlay.side{justify-content:flex-end;align-items:stretch;padding:0}
.overlay.center{align-items:center;padding:16px}
.pal{width:min(660px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-pop);overflow:hidden;display:flex;flex-direction:column;max-height:78vh}
.pal-in{display:flex;align-items:center;gap:10px;padding:0 14px 0 16px;height:60px;border-bottom:1px solid var(--line);flex:none}
.pal-in .i{width:20px;height:20px;color:var(--ink-3)}
.pal-in input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:17px;color:var(--ink)}
.pal-detect{display:flex;align-items:flex-start;gap:9px;padding:10px 16px;font-size:13px;border-bottom:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);flex:none}
.pal-detect .i{margin-top:2px}
.pal-detect.ok{color:var(--ok)}
.pal-detect.warn{color:var(--med)}
.pal-detect.err{color:var(--crit)}
.pal-res{overflow:auto;padding:6px}
.pal-g{padding:10px 10px 4px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.pal-it{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:10px;min-width:0}
.pal-it[aria-selected="true"]{background:var(--accent-soft)}
.pal-it .tx{min-width:0;flex:1}
.pal-it .nm{display:block;font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-it .rt{display:block;font:12px var(--mono);color:var(--ink-3)}
.pal-it .fi{width:34px;height:34px;border-radius:10px}
.pal-none{padding:22px 16px;color:var(--ink-3);font-size:13px;text-align:center}
.pal-foot{display:flex;gap:16px;flex-wrap:wrap;padding:9px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);flex:none}
.pal-foot span{display:inline-flex;align-items:center;gap:5px}
.drawer{width:min(500px,100%);height:100%;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-pop);overflow:auto;padding:20px 22px 28px;display:flex;flex-direction:column;gap:20px;animation:slide .2s ease-out}
.sheet{width:min(720px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-pop);padding:20px;display:flex;flex-direction:column;gap:14px}
#shText{display:block;width:100%;height:320px;resize:vertical;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font:12.5px/1.55 var(--mono);color:var(--ink)}
.sh-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sh-actions .muted{font-size:12px}
.dr-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dr-head h2{font:750 22px/1.2 var(--display);letter-spacing:-.015em}
.dr-head p{color:var(--ink-3);font-size:13px;margin-top:3px}
.dr-sec h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin-bottom:8px}
.dr-sec>p{font-size:14px;line-height:1.55;color:var(--ink-2)}
.dr-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dr-facts .fact{padding:10px 12px}
.parts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.part{display:flex;gap:11px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;min-width:0;flex-wrap:wrap}
.part .tx{flex:1;min-width:150px}
.part b{display:block;font-size:13.5px}
.part .rt{font:12px var(--mono);color:var(--ink-3)}
.guide{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:g}
.guide li{position:relative;padding:12px 12px 12px 44px;border:1px solid var(--line);border-radius:12px;font-size:13.5px;color:var(--ink-2);counter-increment:g}
.guide li::before{content:counter(g);position:absolute;left:12px;top:11px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font:700 12px/22px var(--sans);text-align:center}
.guide b{color:var(--ink)}
.try{font:650 12.5px var(--mono);color:var(--accent);border-bottom:1px dashed var(--accent)}
.vs{display:flex;flex-direction:column;gap:8px}
.vs div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:12.5px}
.vs dt{color:var(--ink-3)}
.vs dt::before{content:"V10 · ";font-weight:700;color:var(--crit)}
.vs dd{color:var(--ink-2)}
.vs dd::before{content:"V11 · ";font-weight:700;color:var(--ok)}
.evbar{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);padding:6px 6px 6px 14px;border-radius:999px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow-pop);font-size:13px}
.evbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.evbar button{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:999px;background:color-mix(in srgb,var(--bg) 16%,transparent);color:var(--bg);font-size:12.5px;font-weight:650;flex:none}

@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(28px);opacity:.5}}

/* ── responsive */
@media (max-width:1180px){
  .pgrid{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "radar" "tiles" "body"}
  .radar{position:static;max-height:none;overflow:visible;display:grid;grid-template-columns:230px minmax(0,1fr);gap:8px 24px;align-items:start}
  .radar-alerts>.radar-head{margin-top:0;padding-top:0;border-top:0}
  .alist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
}
@media (max-width:1600px){
  .bgrid{grid-template-columns:minmax(0,1fr)}

  .two,.net-grid,.bgrid,.bin{grid-template-columns:minmax(0,1fr)}

  .feed,.srcs,.states{grid-template-columns:minmax(0,1fr)}

}

  .nav button{flex:1}
  .brand-sm{display:block}

  .content{padding:16px 16px 104px}
  .radar{grid-template-columns:minmax(0,1fr)}

  .tile{padding:12px}
  .tile-val{font-size:22px}
  .tile-sev span{display:none}
  .id-name{font-size:24px}
  .mono-tile{width:48px;height:48px;font-size:17px;border-radius:13px}
  .idhead{gap:14px}
  .sec{padding:16px}
  .bstats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .evbar{bottom:calc(86px + env(safe-area-inset-bottom,0px))}

}

function parseRut(raw){const c=String(raw).toUpperCase().replace(/[.\s‐-―-]/g,'');if(!/^\d{7,8}[\dK]$/.test(c))return null;const num=+c.slice(0,-1),dv=c.slice(-1),expected=dvOf(num);return{num,dv,expected,valid:dv===expected,clean:c}}

let palSel=0,palList=[];
function palSearch(q){
  const t=q.trim(),res=[];
  if(!t){
    if(S.recent.length){res.push({g:'Recientes'});S.recent.forEach(n=>res.push({type:'ent',num:n}))}
    const top=[...ENT.keys()].map(profile).sort((a,b)=>b.score-a.score).filter(p=>!S.recent.includes(p.num)).slice(0,4);
    if(top.length){res.push({g:'Mayor prioridad en el universo piloto'});top.forEach(p=>res.push({type:'ent',num:p.num}))}
    return{d:{k:'info',t:'Escribe un RUT con o sin puntos, un N° de reporte de 6 dígitos o parte de un nombre.'},res};
  }
  const folio=parseRos(t);
  if(folio){if(ROS.has(folio)){res.push({type:'ros',folio});return{d:{k:'ok',t:`N° de reporte reconocido · ${folio}`},res}}return{d:{k:'warn',t:`No hay un reporte N° ${folio} en el universo piloto.`},res}}
  const rut=parseRut(t);
  if(rut){
    if(rut.valid){if(ENT.has(rut.num)){res.push({type:'ent',num:rut.num});return{d:{k:'ok',t:`RUT válido · ${fmtRut(rut.num)}`},res}}return{d:{k:'warn',t:`RUT válido (${fmtRut(rut.num)}), sin coincidencias en el universo piloto. Las fuentes se consultaron y no registran a esta entidad.`},res}}
    if(/^\d+$/.test(rut.clean)&&ENT.has(+rut.clean)){res.push({g:'¿Falta el dígito verificador?'},{type:'ent',num:+rut.clean});return{d:{k:'info',t:`Parece un RUT sin dígito verificador. El RUT completo es ${fmtRut(+rut.clean)}.`},res}}
    if(ENT.has(rut.num))res.push({g:'¿Quisiste decir?'},{type:'ent',num:rut.num});
    return{d:{k:'err',t:`El dígito verificador no corresponde: para ${fmtN(rut.num)} el DV es ${rut.expected}, no ${rut.dv}.`},res};
  }
  const dg=t.replace(/[.\s-]/g,'');
  if(/^\d+k?$/i.test(dg)){const d=dg.replace(/k$/i,'');[...ENT.keys()].filter(n=>String(n).startsWith(d)).forEach(n=>res.push({type:'ent',num:n}));[...ROS.keys()].filter(f=>f.startsWith(d)).slice(0,6).forEach(f=>res.push({type:'ros',folio:f}));return{d:{k:'info',t:d.length<6?'Sigue escribiendo: RUT de 7 u 8 dígitos más DV, o N° de reporte de 6 dígitos.':'Número incompleto: agrega el dígito verificador del RUT.'},res}}
  const ws=norm(t).split(/\s+/).filter(Boolean),hits=[...ENT.values()].filter(e=>ws.every(w=>norm(e.name).includes(w))).map(e=>profile(e.num)).sort((a,b)=>b.score-a.score);
  hits.forEach(p=>res.push({type:'ent',num:p.num}));
  return{d:hits.length?{k:'info',t:`Búsqueda por nombre · ${hits.length} coincidencia${hits.length>1?'s':''}`}:{k:'warn',t:`Sin coincidencias por nombre para «${t}».`},res};
}

/* ───────── lote */
function classify(raw){
  const folio=parseRos(raw);if(folio)return{kind:'ros',folio,raw};
  const r=parseRut(raw);
  if(r){if(r.valid)return{kind:'rut',num:r.num,raw};if(/^\d+$/.test(r.clean)&&ENT.has(+r.clean))return{kind:'bad',raw,msg:'Falta el dígito verificador.',fix:fmtRut(+r.clean)};return{kind:'bad',raw,msg:`Dígito verificador incorrecto: para ${fmtN(r.num)} corresponde ${r.expected}.`,fix:fmtRut(r.num)}}
  return{kind:'bad',raw,msg:'Formato no reconocido: usa RUT con dígito verificador o N° de reporte de 6 dígitos.'};
}
function parseBatch(text){
  const lines=text.split(/[\n,;\t]+/).map(s=>s.trim()).filter(Boolean),seen=new Set(),items=[];let dup=0;
  lines.forEach(raw=>{const c=classify(raw),key=c.kind==='rut'?'r'+c.num:c.kind==='ros'?'o'+c.folio:'x'+raw.toUpperCase();if(seen.has(key)){dup++;return}seen.add(key);items.push(c)});
  return{lines:lines.length,items,dup,nRut:items.filter(i=>i.kind==='rut').length,nRos:items.filter(i=>i.kind==='ros').length,nBad:items.filter(i=>i.kind==='bad').length};
}
function runBatch(){
  const B=S.batch,P=parseBatch(B.text),rows=new Map(),issues=[];
  const add=(n,o)=>{let r=rows.get(n);if(!r){r={num:n,origins:[]};rows.set(n,r)}if(!r.origins.includes(o))r.origins.push(o)};
  P.items.forEach(it=>{
    if(it.kind==='bad')issues.push({sev:'med',raw:it.raw,msg:it.msg,fix:it.fix});
    else if(it.kind==='rut'){if(ENT.has(it.num))add(it.num,'RUT');else issues.push({sev:'none',raw:it.raw,msg:'RUT válido sin coincidencias en el universo piloto.'})}
    else{const r=ROS.get(it.folio);if(r)r.parts.forEach(([n])=>add(n,'ROS '+it.folio));else issues.push({sev:'none',raw:it.raw,msg:'No existe un reporte con ese número en el universo piloto.'})}
  });
  B.parsed=P;B.rows=[...rows.values()];B.issues=issues;B.processedText=B.text;B.levels=new Set();B.at=new Date();
  updateParse();renderBatchOut();updateNav();
}
function updateParse(){
  const B=S.batch,P=parseBatch(B.text),dirty=B.processedText!==null&&B.processedText!==B.text;
  $('#bParse').innerHTML=P.lines?`<span class="pchip">${P.lines} línea${P.lines>1?'s':''}</span><span class="pchip">${P.items.length} única${P.items.length>1?'s':''}</span>${P.nRut?`<span class="pchip">${P.nRut} RUT válido${P.nRut>1?'s':''}</span>`:''}${P.nRos?`<span class="pchip">${P.nRos} N° de reporte</span>`:''}${P.nBad?`<span class="pchip warn">${glyph('med',10)}${P.nBad} por corregir</span>`:''}${P.dup?`<span class="pchip">${P.dup} duplicada${P.dup>1?'s':''}</span>`:''}${dirty?'<span class="pchip info">Cambios sin procesar</span>':''}`:'<span class="pchip">Sin claves</span>';
  const iss=B.issues;
  $('#bIssues').innerHTML=iss.length?`<div class="issues"><h3>Incidencias <span class="cnt">${iss.length}</span></h3><ul>${iss.map(x=>`<li class="issue">${glyph(x.sev,11)}<span class="mono">${esc(x.raw)}</span><p>${esc(x.msg)}</p>${x.fix?`<button class="btn btn-sm" data-act="bfix" data-raw="${esc(x.raw)}" data-fix="${esc(x.fix)}">Usar ${esc(x.fix)}</button>`:''}</li>`).join('')}</ul></div>`:'';
}
function sortRows(rows){
  const B=S.batch,k=B.sort,d=B.dir,val=r=>{const p=profile(r.num);return k==='score'?p.score:k==='name'?norm(p.name):k==='ros'?p.ros.length:k==='jud'?p.cases.length:k==='red'?p.rels.length:k==='roe'?p.roe:0};
  return[...rows].sort((a,b)=>{const x=val(a),y=val(b);return(x<y?-1:x>y?1:0)*d||profile(b.num).score-profile(a.num).score})
}
function visibleRows(){const B=S.batch,q=norm(B.q.trim());return sortRows(B.rows.filter(r=>{const p=profile(r.num);if(B.levels.size&&!B.levels.has(p.level))return false;if(q&&!norm([p.name,p.rut,p.rut.replace(/\./g,''),...p.alerts.map(a=>a.title),...r.origins].join(' ')).includes(q))return false;return true}))}
function renderBatchOut(){
  const B=S.batch,out=$('#bOut');
  if(!B.processedText){out.innerHTML=`<div class="bempty"><b>La matriz aparecerá aquí</b>Pega RUT o números de reporte y pulsa Procesar lote.</div>`;return}
  const counts=SEVS.map(k=>[k,B.rows.filter(r=>profile(r.num).level===k).length]),viaRos=B.rows.filter(r=>!r.origins.includes('RUT')).length,total=B.rows.length||1;
  out.innerHTML=`<div class="panel-h"><h2>Resultados</h2><span class="muted">${esc(B.label)} · procesado a las ${B.at.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'})}</span></div>
    <div class="bstats"><div class="bstat"><span>Entradas</span><b>${B.parsed.lines}</b></div><div class="bstat"><span>Entidades</span><b>${B.rows.length}</b></div><div class="bstat"><span>Solo vía reporte</span><b>${viaRos}</b></div><div class="bstat"><span>Incidencias</span><b>${B.issues.length}</b></div></div>
    <div class="dist"><div class="dist-h"><h2>Distribución por prioridad</h2><span class="muted">Pulsa un nivel para filtrar</span></div>
      <div class="dist-bar" id="distBar">${counts.filter(c=>c[1]).map(([k,n])=>`<button style="--c:var(--${k});flex:${n/total}" data-act="blevel" data-k="${k}" class="${B.levels.size&&!B.levels.has(k)?'off':''}" aria-label="${SEV[k].l}: ${n}" title="${SEV[k].l}: ${n}">${n}</button>`).join('')}</div>
      <div class="dist-leg">${counts.map(([k,n])=>`<button class="lchip" style="--c:var(--${k});--cs:var(--${k}-soft)" data-act="blevel" data-k="${k}" aria-pressed="${B.levels.has(k)}"${n?'':' disabled'}>${glyph(k,11)}${SEV[k].l} <b>${n}</b></button>`).join('')}</div></div>
    <div class="btools"><label class="field">${I('search')}<span class="sr">Filtrar resultados</span><input id="bQ" type="search" placeholder="Filtrar por nombre, RUT, alerta u origen" value="${esc(B.q)}"></label><span class="muted" id="bCount"></span><button class="btn" data-act="bexport">${I('export')}Exportar CSV</button></div>
    <div class="tblwrap" style="max-height:560px"><table class="tbl matrix"><thead id="bHead"></thead><tbody id="bBody"></tbody></table></div>
    <p class="hint">Pulsa una fila para abrir el perfil y recorre el lote con <kbd>J</kbd> y <kbd>K</kbd>.</p>`;
  $('#bQ').addEventListener('input',e=>{B.q=e.target.value;renderBatchTable()});
  renderBatchTable();
}
function renderBatchTable(){
  const B=S.batch,rows=visibleRows();
  const th=(k,l,cls='')=>`<th scope="col" class="${cls}"${B.sort===k?` aria-sort="${B.dir<0?'descending':'ascending'}"`:''}><button class="th-sort" data-act="bsort" data-k="${k}">${l}${I(B.sort===k?(B.dir<0?'down':'up'):'sort')}</button></th>`;
  $('#bHead').innerHTML=`<tr>${th('score','Prioridad')}${th('name','Entidad')}${th('ros','ROS')}${th('jud','Judicial')}${th('red','Vínculos')}<th scope="col">Tributario</th>${th('roe','Efectivo')}<th scope="col">Alerta principal</th><th scope="col">Origen</th></tr>`;
  const cell=(cat,val,p,tip)=>{const sv=maxSev(p.alerts.filter(a=>a.cat===cat));return`<td><span class="hm-c${sv?'':' z'}" style="${sv?`--c:var(--${sv});--cs:var(--${sv}-soft)`:''}" data-tip="${esc(tip)}">${sv?glyph(sv,10):''}${val}</span></td>`};
  $('#bBody').innerHTML=rows.length?rows.map(r=>{const p=profile(r.num),nR=p.ros.filter(x=>x.role==='R').length,vig=p.cases.filter(c=>c.status==='Vigente').length,mk=p.rels.filter(x=>x.nRos+x.nCases>0).length,s=p.tax&&p.tax.series,a=p.alerts[0];
    return`<tr data-act="brow" data-num="${r.num}" tabindex="0" aria-label="Abrir perfil de ${esc(tc(p.name))}">
      <td><span class="scoreb" style="--c:var(--${p.level})"><span class="sc">${p.score}</span>${SEV[p.level].l}</span></td>
      <td class="ent"><b>${esc(tc(p.name))}</b><span class="sub mono">${p.rut}</span></td>
      ${cell('ros',p.ros.length?`${nR}R · ${p.ros.length-nR}V`:'—',p,`${nR} como reportado, ${p.ros.length-nR} como vinculado`)}
      ${cell('jud',p.cases.length?`${p.cases.length} · ${vig} vig.`:'—',p,`${p.cases.length} causas, ${vig} vigentes`)}
      ${cell('red',p.rels.length?`${p.rels.length} · ${mk} marc.`:'—',p,`${p.rels.length} vínculos, ${mk} con marcas propias`)}
      ${cell('tax',s?(p.tax.end?'Término giro':pct(s.at(-1)[1]/s[0][1]-1)):'—',p,s?`${p.tax.status} · ventas ${fmtN(s.at(-1)[1])} UF`:'Sin registro tributario')}
      ${cell('roe',p.roe||'—',p,`${p.roe} ROE`)}
      <td class="topal">${a?`${glyph(a.sev,10)} ${esc(a.title)}`:'<span class="muted">Sin alertas</span>'}</td>
      <td>${r.origins.map(o=>`<span class="otag">${esc(o)}</span>`).join('')}</td></tr>`}).join(''):`<tr><td colspan="9" class="muted" style="padding:24px;text-align:center">Ningún resultado con estos filtros.</td></tr>`;
  $('#bCount').textContent=`${rows.length} de ${B.rows.length}`;
}
function renderLote(){
  $('#v-lote').innerHTML=`<div class="page-head"><div><div class="kicker">Procesamiento por lotes</div><h1>Búsqueda masiva</h1><p>Pega RUT o números de reporte, uno por línea o separados por coma. El lote valida el dígito verificador, elimina duplicados y expande cada reporte a sus participantes.</p></div></div>
  <div class="bgrid"><section class="panel bin" aria-labelledby="binT"><div class="bin-l"><div class="panel-h"><h2 id="binT">Entrada</h2><span class="muted">una clave por línea</span></div><label class="sr" for="bInput">Claves del lote</label><textarea id="bInput" spellcheck="false" autocomplete="off" rows="12"></textarea></div><div class="bin-r"><div class="bparse" id="bParse" aria-live="polite"></div><div class="bactions"><button class="btn btn-primary" data-act="brun">${I('play')}Procesar lote</button><button class="btn" data-act="bexample">Cargar ejemplo</button><button class="btn btn-ghost" data-act="bclear">Limpiar</button></div><div id="bIssues"></div></div></section>
  <section class="panel" aria-label="Resultados del lote" id="bOut"></section></div>`;
  const ta=$('#bInput');ta.value=S.batch.text;ta.addEventListener('input',()=>{S.batch.text=ta.value;updateParse()});
  updateParse();renderBatchOut();
}
function batchCSV(){
  const h=['rut','nombre','prioridad','nivel','ros_reportado','ros_vinculado','causas','causas_vigentes','vinculos','vinculos_con_marcas','estado_tributario','ventas_uf_ultimo_ano','roe','alerta_principal','origen'];
  const q=v=>{const s=String(v??'');return/[;"\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s};
  return[h.join(';'),...visibleRows().map(r=>{const p=profile(r.num),nR=p.ros.filter(x=>x.role==='R').length,s=p.tax&&p.tax.series;return[p.rut,tc(p.name),p.score,SEV[p.level].l,nR,p.ros.length-nR,p.cases.length,p.cases.filter(c=>c.status==='Vigente').length,p.rels.length,p.rels.filter(x=>x.nRos+x.nCases>0).length,p.tax?p.tax.status:'Sin registro',s?s.at(-1)[1]:'',p.roe,p.alerts[0]?p.alerts[0].title:'',r.origins.join(' + ')].map(q).join(';')})].join('\n');
}

/* ───────── fuentes */
function renderFuentes(){
  $('#v-fuentes').innerHTML=`<div class="page-head"><div><div class="kicker">Trazabilidad</div><h1>Estado de fuentes</h1><p>Frescura de cada fuente respecto del corte del 28-09-2026. La barra muestra la antigüedad del corte; la marca vertical, el plazo comprometido.</p></div></div>
  <div class="src-grid">${SOURCES.map(s=>{const f=freshness(s),pctW=f.age==null?0:Math.min(100,f.age/(s.sla*1.25)*100);return`<article class="panel src"><header><span class="fi">${I(s.icon)}</span><div><h3>${s.name}</h3><p>${esc(s.owner)}</p></div><span class="lvl" style="--c:var(--${f.k==='ok'?'ok':f.k});--cs:var(--${f.k==='ok'?'ok':f.k}-soft)">${f.k==='ok'?I('check'):glyph(f.k,10)}${f.l}</span></header>
    ${s.offline?`<p class="muted" style="font-size:13px">La suite opera sin conexiones externas. En cada perfil esta fuente figura como <b>no consultada</b>, nunca como “sin registro”.</p>`:`<div><div class="fresh-bar" role="img" aria-label="${f.age} días de antigüedad, plazo ${s.sla} días"><i style="width:${pctW.toFixed(1)}%;--c:var(--${f.k==='ok'?'ok':f.k})"></i><span class="sla" style="left:80%"></span></div><div class="fresh-meta"><span>Corte ${fmtD(s.cut)}</span><span>${f.age} día${f.age===1?'':'s'} · plazo ${s.sla} día${s.sla===1?'':'s'}</span></div></div>`}</article>`}).join('')}</div>
  <section class="panel"><h2 style="font-size:15px">Cómo leer la cobertura en cada perfil</h2><div class="states"><div class="state"><span class="sg hit"></span><span><b>Con registro</b><span>La fuente se consultó y tiene antecedentes de la entidad.</span></span></div><div class="state"><span class="sg nohit"></span><span><b>Sin registro</b><span>La fuente se consultó y no tiene antecedentes. Es un resultado, no un vacío.</span></span></div><div class="state"><span class="sg nq"></span><span><b>No consultada</b><span>La fuente no se pudo consultar. Nunca se presenta como cero.</span></span></div></div></section>`;
}

/* ───────── vistas y acciones */
function setView(v){
  S.view=v;['perfil','lote','fuentes'].forEach(x=>{$('#v-'+x).hidden=x!==v});
  $$('#nav button').forEach(b=>{if(b.dataset.view===v)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  $('#evbar').hidden=!(v==='perfil'&&S.evidence);
  try{history.replaceState(null,'','#'+v)}catch(e){}
}
function openEntity(num,fromBatch){
  if(!ENT.has(num))return;
  if(!fromBatch)S.bctx=null;
  S.ent=num;S.evidence=null;S.relSel=null;S.relHide=new Set();
  S.recent=[num,...S.recent.filter(n=>n!==num)].slice(0,6);store.set('pr.recent',S.recent);
  closeLayers();setView('perfil');renderProfile();window.scrollTo({top:0});
}
function updateNav(){const hi=S.batch.rows.filter(r=>SEV[profile(r.num).level].r>=3).length,b=$('#navBadge');b.hidden=!hi;b.textContent=hi;b.title=`${hi} entidades de prioridad alta o crítica en el lote`;const late=SOURCES.some(s=>!s.offline&&freshness(s).k==='high');$('#navDot').hidden=!late;$('#navDot').title='Hay fuentes desfasadas'}
function setThemeIcon(){const dark=(document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))==='dark';$('#themeUse').setAttribute('href',dark?'#i-sun':'#i-moon');$('#themeBtn').setAttribute('aria-label',dark?'Cambiar a tema claro':'Cambiar a tema oscuro')}

document.addEventListener('click',e=>{
  if(e.target.classList&&e.target.classList.contains('overlay')){closeLayers();return}
  const pi=e.target.closest('[data-pi]');if(pi){palPick(+pi.dataset.pi);return}
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,d=t.dataset;
  switch(a){
    case'view':if(d.view==='perfil'&&!$('#v-perfil').innerHTML)renderProfile();setView(d.view);window.scrollTo({top:0});break;
    case'palette':openPalette();break;
    case'guide':openGuide();break;
    case'theme':{const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),nx=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',nx);store.set('pr.theme',nx);setThemeIcon();break}
    case'close':closeLayers();break;
    case'try':closeLayers();openPalette(d.q);break;
    case'open-ent':e.stopPropagation();openEntity(+d.num);break;
    case'open-ros':openRos(d.folio);break;
    case'goto':if(S.view!=='perfil')setView('perfil');gotoSec(d.sec);break;
    case'goto-ref':{const el=$(`#v-perfil [data-ref="${CSS.escape(d.ref)}"]`);gotoSec(d.sec,el);if(el){el.classList.add('is-ev');setTimeout(()=>{if(!S.evidence||!S.evidence.refs.includes(d.ref))el.classList.remove('is-ev')},2200)}break}
    case'evidence':{const p=profile(S.ent),al=p.alerts.find(x=>x.id===d.id);if(!al)break;S.evidence=S.evidence&&S.evidence.id===al.id?null:al;$$('.al').forEach(li=>{const b=li.querySelector('.al-main'),on=S.evidence&&b.dataset.id===S.evidence.id;li.classList.toggle('active',!!on);b.setAttribute('aria-pressed',!!on)});applyEvidence(!!S.evidence);break}
    case'clear-ev':S.evidence=null;$$('.al.active').forEach(li=>{li.classList.remove('active');li.querySelector('.al-main').setAttribute('aria-pressed','false')});applyEvidence(false);break;
    case'copy':copyText(d.text,`RUT ${d.text} copiado`);break;
    case'export-profile':{const p=profile(S.ent);openSheet('Ficha de la entidad',`${tc(p.name)} · ${p.rut}`,profileText(p),`ficha_${p.rut.replace(/\./g,'')}.txt`);break}
    case'add-batch':{const r=fmtRut(+d.num),B=S.batch;if(parseBatch(B.text).items.some(i=>i.kind==='rut'&&i.num===+d.num)){toast('Ya está en el lote')}else{B.text=(B.text.trim()?B.text.trim()+'\n':'')+r;if($('#bInput'))$('#bInput').value=B.text;updateParse();toast(`${r} agregado al lote · procésalo en Lote`)}break}
    case'ros-to-batch':{const B=S.batch,have=parseBatch(B.text).items;const add=ROS.get(d.folio).parts.map(([n])=>n).filter(n=>!have.some(i=>i.kind==='rut'&&i.num===n)).map(fmtRut);if(add.length){B.text=(B.text.trim()?B.text.trim()+'\n':'')+add.join('\n');if($('#bInput'))$('#bInput').value=B.text;updateParse()}toast(add.length?`${add.length} participante${add.length>1?'s':''} agregado${add.length>1?'s':''} al lote`:'Los participantes ya estaban en el lote');break}
    case'tl':S.tlRange=d.r;$$('[data-act="tl"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.r===d.r));redraw($('[data-chart="timeline"]'));break;
    case'rel-sel':S.relSel=+d.num;redraw($('[data-chart="net"]'));$('#netDetail').innerHTML=netDetail(profile(S.ent));break;
    case'rtype':{const tp=d.t;S.relHide.has(tp)?S.relHide.delete(tp):S.relHide.add(tp);t.setAttribute('aria-pressed',!S.relHide.has(tp));redraw($('[data-chart="net"]'));break}
    case'bstep':stepBatch(+d.d);break;
    case'bjump':if(S.bctx){S.bctx.i=+d.i;openEntity(S.bctx.list[S.bctx.i],true)}break;
    case'brun':S.batch.label=S.batch.text===EXAMPLE?'Lote de ejemplo':'Lote';runBatch();toast(`Lote procesado · ${S.batch.rows.length} entidades`);break;
    case'bexample':S.batch.text=EXAMPLE;$('#bInput').value=EXAMPLE;updateParse();break;
    case'bclear':S.batch.text='';$('#bInput').value='';S.batch.processedText=null;S.batch.rows=[];S.batch.issues=[];updateParse();renderBatchOut();updateNav();$('#bInput').focus();break;
    case'bfix':{const B=S.batch,lines=B.text.split('\n'),i=lines.findIndex(l=>l.trim()===d.raw);if(i>=0){lines[i]=d.fix;B.text=lines.join('\n');$('#bInput').value=B.text;runBatch();toast(`Corregido a ${d.fix}`)}break}
    case'blevel':{const L=S.batch.levels;L.has(d.k)?L.delete(d.k):L.add(d.k);renderBatchOut();break}
    case'bsort':{const B=S.batch;if(B.sort===d.k)B.dir*=-1;else{B.sort=d.k;B.dir=d.k==='name'?1:-1}renderBatchTable();break}
    case'brow':{const list=visibleRows().map(r=>r.num);S.bctx={list,i:list.indexOf(+d.num)};openEntity(+d.num,true);break}
    case'bexport':openSheet('Resultados del lote',`${visibleRows().length} entidades · separador punto y coma`,batchCSV(),'perfil_reportado_lote.csv');break;
    case'sh-copy':copyText($('#shText').value,'Contenido copiado');break;
    case'sh-dl':download(d.fn,$('#shText').value);break;
  }
});
document.addEventListener('change',e=>{const id=e.target.dataset&&e.target.dataset.review;if(!id)return;const set=new Set(S.reviewed[S.ent]||[]);e.target.checked?set.add(id):set.delete(id);S.reviewed[S.ent]=[...set];store.set('pr.reviewed',S.reviewed);const li=e.target.closest('.al');li.classList.toggle('done',e.target.checked);const p=profile(S.ent),n=p.alerts.filter(a=>set.has(a.id)).length,pr=$('.rev-prog');if(pr)pr.innerHTML=`${I('check')}${n} de ${p.alerts.length} revisadas`});
function stepBatch(dd){const c=S.bctx;if(!c)return;const j=c.i+dd;if(j<0||j>=c.list.length)return;c.i=j;openEntity(c.list[j],true)}
$('#palInput').addEventListener('input',()=>{palSel=0;palRender()});
$('#palInput').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();if(palList.length){palSel=(palSel+1)%palList.length;palRender();$('#po'+palSel)?.scrollIntoView({block:'nearest'})}}else if(e.key==='ArrowUp'){e.preventDefault();if(palList.length){palSel=(palSel-1+palList.length)%palList.length;palRender();$('#po'+palSel)?.scrollIntoView({block:'nearest'})}}else if(e.key==='Enter'){e.preventDefault();palPick(palSel)}});
document.addEventListener('keydown',e=>{
  const ae=document.activeElement,typing=ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return}
  if(e.key==='Escape'){if(anyLayer()){e.preventDefault();closeLayers()}else if(S.evidence){S.evidence=null;$$('.al.active').forEach(li=>li.classList.remove('active'));applyEvidence(false)}return}
  if(e.key==='Tab'&&anyLayer()){const box=['#palette','#drawer','#sheet'].map(s=>$(s)).find(x=>!x.hidden),f=$$('button,input,textarea,[tabindex="0"]',box).filter(x=>!x.disabled&&x.offsetParent!==null);if(f.length){const a=f[0],z=f.at(-1);if(e.shiftKey&&ae===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&ae===z){e.preventDefault();a.focus()}}return}
  if(typing||anyLayer())return;
  if(e.key==='/'){e.preventDefault();openPalette()}
  else if(e.key==='?'){openGuide()}
  else if((e.key==='j'||e.key==='k')&&S.view==='perfil'&&S.bctx&&!e.metaKey&&!e.ctrlKey&&!e.altKey){stepBatch(e.key==='j'?1:-1)}
  else if((e.key==='Enter'||e.key===' ')&&ae&&ae.matches('[data-act]:not(button):not(input):not(label)')){e.preventDefault();ae.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',setThemeIcon);

/* ───────── arranque */
const MAC=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent);
$('#kbdHint').textContent=MAC?'⌘K':'Ctrl K';
const savedTheme=store.get('pr.theme',null);if(savedTheme==='dark'||savedTheme==='light')document.documentElement.setAttribute('data-theme',savedTheme);
setThemeIcon();
renderLote();runBatch();renderFuentes();
S.recent=[76123456,...S.recent.filter(n=>n!==76123456)].slice(0,6);
renderProfile();
const h=(location.hash||'').slice(1);setView(['lote','fuentes'].includes(h)?h:'perfil');
})();
</script>
