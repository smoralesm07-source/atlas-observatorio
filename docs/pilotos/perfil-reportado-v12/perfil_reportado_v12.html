<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src 'none'; connect-src 'none'; object-src 'none'; frame-src 'none'; media-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'">
<title>Perfil del Reportado</title>
<style>
/* Concepto: bandeja de prioridad (izq.) → una entidad en foco (centro) → detalle a pedido en pestañas.
   Sobrio: un solo acento, severidad desaturada, líneas finas, movimiento breve y con propósito. */
:root{
  --bg:#f4f5f7;--surface:#ffffff;--surface-2:#f9fafb;--sunken:#eceef2;
  --line:#e3e6eb;--line-2:#cfd4dc;
  --ink:#0f1623;--ink-2:#353f50;--ink-3:#5a6577;--ink-4:#949dab;
  --accent:#27467f;--accent-hover:#1d3867;--on-accent:#ffffff;
  --crit:#b3261e;--high:#b4530a;--med:#8a6500;--low:#2f7584;--none:#737d8f;--ok:#2b7a55;
  --scrim:rgb(12 17 26 / .40);
  --shadow:0 1px 2px rgb(16 24 40 / .04),0 1px 3px rgb(16 24 40 / .05);
  --shadow-pop:0 20px 48px rgb(16 24 40 / .18),0 2px 6px rgb(16 24 40 / .06);
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:ui-sans-serif,system-ui,-apple-system,"Segoe UI Variable Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --top:56px;--ease:cubic-bezier(.2,.7,.2,1);
  --accent-soft:color-mix(in srgb,var(--accent) 9%,var(--surface));
  --accent-mid:color-mix(in srgb,var(--accent) 34%,var(--surface));
  --crit-soft:color-mix(in srgb,var(--crit) 9%,var(--surface));
  --high-soft:color-mix(in srgb,var(--high) 10%,var(--surface));
  --med-soft:color-mix(in srgb,var(--med) 11%,var(--surface));
  --low-soft:color-mix(in srgb,var(--low) 10%,var(--surface));
  --none-soft:color-mix(in srgb,var(--none) 10%,var(--surface));
  --ok-soft:color-mix(in srgb,var(--ok) 10%,var(--surface));
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0d12;--surface:#12151c;--surface-2:#161a22;--sunken:#1c212b;
  --line:#232834;--line-2:#303746;
  --ink:#eceff4;--ink-2:#c1c8d3;--ink-3:#8f99a8;--ink-4:#5f6878;
  --accent:#92aae4;--accent-hover:#aabdec;--on-accent:#0b0d12;
  --crit:#f2766c;--high:#ef9a45;--med:#dfb53f;--low:#6fb8c6;--none:#8b95a7;--ok:#5cc08f;
  --scrim:rgb(0 0 0 / .6);
  --shadow:0 1px 2px rgb(0 0 0 / .3);
  --shadow-pop:0 20px 48px rgb(0 0 0 / .55),0 2px 6px rgb(0 0 0 / .3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b0d12;--surface:#12151c;--surface-2:#161a22;--sunken:#1c212b;
  --line:#232834;--line-2:#303746;
  --ink:#eceff4;--ink-2:#c1c8d3;--ink-3:#8f99a8;--ink-4:#5f6878;
  --accent:#92aae4;--accent-hover:#aabdec;--on-accent:#0b0d12;
  --crit:#f2766c;--high:#ef9a45;--med:#dfb53f;--low:#6fb8c6;--none:#8b95a7;--ok:#5cc08f;
  --scrim:rgb(0 0 0 / .6);
  --shadow:0 1px 2px rgb(0 0 0 / .3);
  --shadow-pop:0 20px 48px rgb(0 0 0 / .55),0 2px 6px rgb(0 0 0 / .3);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,p,figure,dl,dd,ol,ul{margin:0}
ol,ul{padding:0;list-style:none}
h1,h2,h3{text-wrap:balance}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:disabled{cursor:not-allowed;opacity:.4}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.g{flex:none;display:inline-block}
.mono{font-family:var(--mono);font-size:.93em;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.label{font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
kbd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border:1px solid var(--line);border-radius:5px;background:var(--surface-2);color:var(--ink-3);font:600 11px/1 var(--mono)}

.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:600;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn:hover:not(:disabled){border-color:var(--line-2);color:var(--ink)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover);color:var(--on-accent)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover:not(:disabled){background:var(--sunken);border-color:transparent}
.btn-sm{height:28px;padding:0 10px;font-size:12.5px}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;color:var(--ink-3)}
.icon-btn:hover{background:var(--sunken);color:var(--ink)}
.icon-btn .i{width:18px;height:18px}
.sev{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;color:var(--c);white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;background:var(--sunken);color:var(--ink-2);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.hi{background:var(--high-soft);color:var(--high)}
.tag.ac{background:var(--accent-soft);color:var(--accent)}
.tag.dk{background:var(--ink);color:var(--bg)}
.cnt{display:inline-grid;place-items:center;min-width:20px;height:18px;padding:0 5px;border-radius:999px;background:var(--sunken);color:var(--ink-3);font:650 11px/1 var(--sans);font-variant-numeric:tabular-nums}

@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@keyframes fade{from{opacity:0}}
@keyframes ringin{from{stroke-dashoffset:100}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes slide{from{transform:translateX(24px);opacity:.4}}
.enter{animation:rise .34s var(--ease) both}
.enter-2{animation:rise .34s var(--ease) .06s both}
.enter-3{animation:rise .34s var(--ease) .12s both}
.enter-4{animation:rise .34s var(--ease) .18s both}

/* ── estructura */
.app{display:grid;grid-template-columns:64px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;gap:18px;padding:12px 8px;border-right:1px solid var(--line);background:var(--surface);z-index:30}
.brand{width:36px;height:36px;display:block;flex:none}
.nav{display:flex;flex-direction:column;gap:4px;width:100%}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border-radius:10px;color:var(--ink-4);font-size:10.5px;font-weight:650}
.nav button .i{width:20px;height:20px}
.nav button:hover{color:var(--ink-2);background:var(--sunken)}
.nav button[aria-current="page"]{color:var(--ink);background:var(--sunken)}
.nav-dot{position:absolute;top:6px;right:13px;width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--surface)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;height:var(--top);display:flex;align-items:center;gap:16px;padding:0 24px;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid var(--line)}
.brand-sm{display:none;width:30px;height:30px}
.appname{font-size:14px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.appname span{color:var(--ink-4);font-weight:500;margin-left:8px}
.search{flex:1;min-width:0;max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px;height:36px;padding:0 8px 0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink-4);font-size:13.5px}
.search:hover{border-color:var(--line-2);color:var(--ink-3)}
.search>span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-r{display:flex;align-items:center;gap:6px;flex:none}
.corte{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);white-space:nowrap;margin-right:6px}
.corte i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.corte b{font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.demo{font-size:11px;font-weight:650;color:var(--ink-3);border:1px dashed var(--line-2);border-radius:6px;padding:2px 7px;white-space:nowrap}
.content{flex:1;min-width:0}

/* ── entidades: bandeja + foco */
.split{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:calc(100vh - var(--top))}
.wl{position:sticky;top:var(--top);height:calc(100vh - var(--top));display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--surface)}
.wl-h{padding:18px 18px 12px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
.wl-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.wl-top h2{font-size:15px;font-weight:650}
.seg{display:inline-flex;padding:2px;border-radius:8px;background:var(--sunken);gap:2px}
.seg button{height:26px;padding:0 10px;border-radius:6px;font-size:12px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.wl-sum{display:flex;flex-direction:column;gap:8px}
.dbar{display:flex;height:6px;border-radius:99px;overflow:hidden;gap:2px;background:var(--sunken)}
.dbar i{background:var(--c);transform-origin:left;animation:growx .6s var(--ease) both}
.wl-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-3)}
.wl-legend button{display:inline-flex;align-items:center;gap:5px;padding:2px 0;color:var(--ink-3);border-bottom:1.5px solid transparent}
.wl-legend button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--c)}
.wl-legend b{font-weight:650;color:var(--ink-2);font-variant-numeric:tabular-nums}
.wl-list{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:2px}
.wi{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;align-items:center;width:100%;padding:10px;border-radius:10px;transition:background .15s}
.wi:hover{background:var(--surface-2)}
.wi[aria-current="true"]{background:var(--sunken)}
.wi-t{min-width:0}
.wi-t b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wi-t span{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wi-t .wi-r{color:var(--ink-2)}
.mring{position:relative;width:36px;height:36px;display:grid;place-items:center}
.mring svg{position:absolute;inset:0}
.mring b{position:relative;font:650 11.5px/1 var(--sans);font-variant-numeric:tabular-nums;color:var(--ink)}
.wl-empty{padding:28px 18px;color:var(--ink-3);font-size:13px;text-align:center}
.wl-foot{padding:10px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-4);display:flex;gap:10px;align-items:center}

.focus{min-width:0;padding:28px 36px 64px;max-width:1180px;width:100%}
.back{display:none;margin:-8px 0 14px}
.fhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12.5px;color:var(--ink-3)}
.eyebrow .sep{width:3px;height:3px;border-radius:50%;background:var(--ink-4)}
.fname{margin:6px 0 10px;font:620 32px/1.1 var(--display);letter-spacing:-.025em;overflow-wrap:anywhere}
.fmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.rut{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font:600 13px var(--mono);color:var(--ink-2)}
.rut .i{width:14px;height:14px;color:var(--ink-4)}
.rut:hover{border-color:var(--line-2);color:var(--ink)}
.factions{display:flex;gap:6px;margin-top:16px}
.prio{display:flex;align-items:center;gap:18px}
.bring{position:relative;width:128px;height:128px;flex:none}
.bring svg{position:absolute;inset:0;width:100%;height:100%}
.bring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bring-c b{font:300 42px/1 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.bring-c span{font-size:11px;color:var(--ink-4);margin-top:3px}
.ring-v{animation:ringin 1s var(--ease) both}
.prio-t{display:flex;flex-direction:column;gap:6px;max-width:190px}
.prio-t .lv{font:620 20px/1.1 var(--display);color:var(--c);letter-spacing:-.01em}
.prio-t p{font-size:12px;color:var(--ink-3);line-height:1.45}

.block{margin-top:28px}
.block-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.why{border-top:1px solid var(--line)}
.why li{border-bottom:1px solid var(--line)}
.why button{display:grid;grid-template-columns:18px minmax(0,1fr) auto 18px;gap:14px;align-items:center;width:100%;padding:14px 4px;transition:background .15s,padding .15s}
.why button:hover{background:var(--surface);padding-left:10px;padding-right:8px}
.why .g{justify-self:center}
.why-t b{display:block;font-size:14.5px;font-weight:600;line-height:1.35}
.why-t span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.why-m{font-size:12px;color:var(--ink-3);text-align:right;white-space:nowrap}
.why-m b{display:block;font-weight:650;color:var(--c)}
.why .go{color:var(--ink-4);transition:transform .15s,color .15s}
.why button:hover .go{transform:translateX(3px);color:var(--ink)}
.more{margin-top:10px;font-size:12.5px;font-weight:600;color:var(--accent)}
.more:hover{text-decoration:underline}

.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.met{position:relative;display:flex;flex-direction:column;gap:2px;padding:16px 18px 14px;text-align:left;min-width:0;transition:background .15s}
.met+.met{border-left:1px solid var(--line)}
.met:hover{background:var(--surface-2)}
.met-l{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink-3)}
.met-l .g{margin-left:auto}
.met-v{font:300 30px/1.15 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:4px}
.met-v small{font-size:13px;font-weight:500;color:var(--ink-3);letter-spacing:0;margin-left:4px}
.met-s{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.met-viz{display:block;height:26px;margin-top:10px}

.tabs{position:relative;display:flex;gap:4px;margin-top:32px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 12px;font-size:13.5px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab .g{margin-right:-2px}
.tab-ink{position:absolute;bottom:-1px;height:2px;background:var(--ink);border-radius:2px;transition:left .28s var(--ease),width .28s var(--ease)}
.pane{padding-top:24px;min-height:320px}
.pane>*{animation:rise .3s var(--ease) both}

.sub-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.sub-h h3{font-size:14px;font-weight:650}
.sub-h p{font-size:12.5px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px}
.card{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:18px;min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.chart{position:relative}
.chart svg{display:block;overflow:visible}
.ct{fill:var(--ink-4);font:11px var(--sans)}
.ct-b{fill:var(--ink-3);font:600 11.5px var(--sans)}
.ct-v{fill:var(--ink);font:650 12px var(--sans)}
.ct-hot{fill:var(--med);font:650 11px var(--sans)}
.nl{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.drawn{stroke-dasharray:1;animation:draw 1s var(--ease) both}
.bar-in{transform-box:fill-box;transform-origin:bottom;animation:grow .6s var(--ease) both}
.mk{cursor:pointer;transition:opacity .15s}
.mk:focus{outline:none}
.mk:focus-visible .hit{stroke:var(--ink);stroke-width:2.5}
.pop{animation:fade .5s var(--ease) both}
.tl{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow-x:auto}
.tl>.chart{min-width:620px}
.tl-guide{position:absolute;top:22px;bottom:6px;width:1px;background:var(--ink-4);pointer-events:none}
.tl-guide span{position:absolute;top:-20px;left:50%;transform:translateX(-50%);padding:1px 6px;border-radius:4px;background:var(--ink);color:var(--bg);font:600 10.5px var(--mono);white-space:nowrap}
.feed li{display:block;border-bottom:1px solid var(--line)}
.feed li:last-child{border-bottom:0}
.feed button{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;width:100%;padding:11px 2px;text-align:left}
.feed button:hover b{color:var(--accent)}
.feed time{font:600 12px var(--mono);color:var(--ink-3);padding-top:1px}
.feed b{display:block;font-size:13px;font-weight:600;transition:color .15s}
.feed small{display:block;font-size:12px;color:var(--ink-3)}
.alist li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 2px;border-bottom:1px solid var(--line)}
.alist li:last-child{border-bottom:0}
.alist .g{margin-top:4px;justify-self:center}
.alist b{display:block;font-size:13px;font-weight:600}
.alist span{display:block;font-size:12px;color:var(--ink-3)}
.alist .pts{font:600 12px var(--mono);color:var(--ink-3)}
.alist li.done b{color:var(--ink-3);text-decoration:line-through}
.chk{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--ink-3);cursor:pointer}
.chk input{accent-color:var(--accent);margin:0;width:14px;height:14px}
.rules{margin-top:14px;font-size:12.5px;color:var(--ink-3)}
.rules summary{cursor:pointer;font-weight:600;color:var(--ink-2)}
.rules table{width:100%;border-collapse:collapse;margin-top:8px}
.rules td{padding:5px 2px;border-top:1px solid var(--line)}
.rules td:last-child{text-align:right;font-family:var(--mono)}

.stats{display:flex;flex-wrap:wrap;gap:12px 36px;margin-bottom:22px}
.stat span{display:block;font-size:12px;color:var(--ink-3)}
.stat b{font:300 24px/1.2 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hbars{display:flex;flex-direction:column;gap:11px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;font-size:12.5px;color:var(--ink-2)}
.hbar b{font-weight:600;font-variant-numeric:tabular-nums}
.hbar .t{grid-column:1/-1;height:6px;border-radius:99px;background:var(--sunken);overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:99px;background:var(--accent);transform-origin:left;animation:growx .7s var(--ease) both}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tr[data-act]{cursor:pointer}
.tbl tr[data-act]:hover td{background:var(--surface-2)}
.tbl .r{text-align:right}
.tbl .chev{width:30px;color:var(--ink-4)}
.sub{display:block;font-size:12px;color:var(--ink-3)}
.sub.hot{color:var(--high);font-weight:600}
.role{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.role i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.role.v i{background:transparent;box-shadow:inset 0 0 0 1.6px var(--accent)}
tr.is-ev td{background:var(--accent-soft)!important}
.is-ev:not(tr){box-shadow:0 0 0 2px var(--accent);border-radius:12px}

.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.case{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.case-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ruc{font:600 12.5px var(--mono);color:var(--ink-3)}
.case h3{font:620 17px/1.3 var(--display);letter-spacing:-.01em}
.dur{height:4px;border-radius:99px;background:var(--sunken);overflow:hidden}
.dur i{display:block;height:100%;background:var(--c);transform-origin:left;animation:growx .8s var(--ease) both}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.dl dt{font-size:12px;color:var(--ink-3)}
.dl dd{font-size:13px;font-weight:600;margin-top:1px}
.co{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:12px;border-top:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.net{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:18px}
.net-g{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow-x:auto}
.net-g>.chart{min-width:520px}
.node{cursor:pointer}
.node:focus{outline:none}
.node:focus-visible .hit{stroke:var(--accent);stroke-width:3}
.node.dim,.edge.dim{opacity:.12}
.nd{display:flex;flex-direction:column;gap:14px}
.nd-h b{display:block;font-size:15px;font-weight:620;line-height:1.3}
.nd dl{display:flex;flex-direction:column;gap:10px}
.nd dt{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.nd dd{font-size:13px;margin-top:2px;color:var(--ink-2)}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tchip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface)}
.tchip[aria-pressed="false"]{color:var(--ink-4);border-style:dashed}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:24px}
.fact dt{font-size:12px;color:var(--ink-3)}
.fact dd{font-size:15px;font-weight:600;margin-top:3px}
.fact dd small{display:block;font-size:12px;font-weight:500;color:var(--ink-3)}
.srcs li{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line)}
.srcs li:last-child{border-bottom:0}
.srcs b{font-size:13.5px;font-weight:600}
.srcs small{display:block;font-size:12px;color:var(--ink-3)}
.srcs small.warn{color:var(--high)}
.sst{text-align:right;font-size:12.5px;font-weight:600;white-space:nowrap}
.sst small{font-weight:500}
.sg{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.sg.hit{background:var(--ink-2)}
.sg.nohit{box-shadow:inset 0 0 0 1.8px var(--ink-3)}
.sg.nq{border:1.8px dashed var(--ink-4)}
.empty{display:flex;gap:12px;align-items:center;padding:22px;border:1px dashed var(--line-2);border-radius:12px;color:var(--ink-3);font-size:13px}

/* ── lote y fuentes */
.page{padding:32px 36px 64px;max-width:1320px}
.page-h{margin-bottom:24px}
.page-h h1{font:620 28px/1.15 var(--display);letter-spacing:-.02em;margin-top:6px}
.page-h p{margin-top:8px;max-width:70ch;color:var(--ink-3);font-size:13.5px}
.lote{display:grid;grid-template-columns:320px minmax(0,1fr);gap:28px;align-items:start}
#bInput{display:block;width:100%;min-height:280px;resize:vertical;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font:13px/1.75 var(--mono);color:var(--ink)}
#bInput:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.bparse{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.bact{display:flex;flex-wrap:wrap;gap:8px}
.issues{margin-top:20px}
.issues li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:4px 10px;padding:10px 0;border-top:1px solid var(--line);font-size:12.5px}
.issues .g{margin-top:4px}
.issues p{grid-column:2;color:var(--ink-3)}
.issues .btn{grid-column:2;justify-self:start;margin-top:4px}
.bsum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
.bsum>div{background:var(--surface);padding:14px 16px}
.bsum span{font-size:12px;color:var(--ink-3)}
.bsum b{display:block;font:300 26px/1.2 var(--display);font-variant-numeric:tabular-nums}
.hm{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--c);font-variant-numeric:tabular-nums}
.hm.z{color:var(--ink-4);font-weight:500}
.src-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.src{display:flex;flex-direction:column;gap:14px}
.src header{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.src h3{font-size:14.5px;font-weight:620}
.src p{font-size:12.5px;color:var(--ink-3)}
.fresh{position:relative;height:6px;border-radius:99px;background:var(--sunken)}
.fresh i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--c);transform-origin:left;animation:growx .8s var(--ease) both}
.fresh .sla{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink-3);border-radius:1px}
.fresh-m{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--ink-3)}

/* ── capas */
.overlay{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;animation:fade .15s ease-out}
.overlay.side{justify-content:flex-end;align-items:stretch;padding:0}
.overlay.center{align-items:center}
.pal{width:min(620px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-pop);overflow:hidden;display:flex;flex-direction:column;max-height:76vh;animation:rise .2s var(--ease)}
.pal-in{display:flex;align-items:center;gap:10px;height:56px;padding:0 14px 0 16px;border-bottom:1px solid var(--line)}
.pal-in .i{width:19px;height:19px;color:var(--ink-4)}
.pal-in input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px}
.pal-d{display:flex;gap:9px;align-items:flex-start;padding:10px 16px;font-size:12.5px;border-bottom:1px solid var(--line);color:var(--ink-3)}
.pal-d .i{margin-top:1px}
.pal-d.ok{color:var(--ok)}.pal-d.warn{color:var(--med)}.pal-d.err{color:var(--crit)}
.pal-r{overflow:auto;padding:6px}
.pal-g{padding:10px 10px 4px}
.pi{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:8px 10px;border-radius:9px}
.pi[aria-selected="true"]{background:var(--sunken)}
.pi b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi span.s{display:block;font:12px var(--mono);color:var(--ink-3)}
.pi .ic{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;background:var(--sunken);color:var(--ink-3)}
.pal-none{padding:22px;text-align:center;color:var(--ink-3);font-size:13px}
.pal-f{display:flex;gap:16px;flex-wrap:wrap;padding:9px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-4)}
.pal-f span{display:inline-flex;align-items:center;gap:5px}
.drawer{width:min(480px,100%);height:100%;overflow:auto;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-pop);padding:24px;display:flex;flex-direction:column;gap:22px;animation:slide .24s var(--ease)}
.sheet{width:min(700px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-pop);padding:22px;display:flex;flex-direction:column;gap:14px;animation:rise .2s var(--ease)}
#shText{display:block;width:100%;height:300px;resize:vertical;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font:12.5px/1.55 var(--mono);color:var(--ink)}
.dr-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dr-h h2{font:620 22px/1.2 var(--display);letter-spacing:-.015em;margin-top:4px}
.dr-h p{font-size:13px;color:var(--ink-3);margin-top:3px}
.dr-f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.dr-s>p{font-size:14px;line-height:1.6;color:var(--ink-2);margin-top:8px}
.parts li{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.parts .tx{flex:1;min-width:150px}
.parts b{display:block;font-size:13.5px;font-weight:600}
.parts .s{font:12px var(--mono);color:var(--ink-3)}
.guide li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;padding:13px 0;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-2)}
.guide li>span:first-child{font:600 13px var(--mono);color:var(--ink-4)}
.guide b{color:var(--ink)}
.try{font:600 12.5px var(--mono);color:var(--accent);border-bottom:1px dashed var(--accent)}
.evbar{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);padding:6px 6px 6px 14px;border-radius:999px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow-pop);font-size:13px;animation:rise .25s var(--ease)}
.evbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.evbar button{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:999px;background:color-mix(in srgb,var(--bg) 16%,transparent);color:var(--bg);font-size:12.5px;font-weight:600;flex:none}
.toast{position:fixed;left:50%;top:calc(var(--top) + 14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:80;max-width:calc(100% - 32px);padding:9px 14px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;box-shadow:var(--shadow-pop);animation:rise .2s var(--ease)}
.tip{position:fixed;z-index:90;max-width:280px;padding:7px 10px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.45;white-space:pre-line;pointer-events:none;box-shadow:var(--shadow-pop)}

@media (max-width:1180px){
  .split{grid-template-columns:300px minmax(0,1fr)}
  .focus{padding:24px 24px 56px}
  .fhead{grid-template-columns:minmax(0,1fr)}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .met:nth-child(3){border-left:0}
  .met:nth-child(n+3){border-top:1px solid var(--line)}
  .net{grid-template-columns:minmax(0,1fr)}
  .lote{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  .split{grid-template-columns:minmax(0,1fr)}
  .wl{position:static;height:auto;border-right:0}
  .split:not(.mdetail) .focus{display:none}
  .split.mdetail .wl{display:none}
  .back{display:inline-flex}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .corte,.appname span{display:none}
  .bsum{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line)}
  .rail .brand{display:none}
  .nav{flex-direction:row;justify-content:space-around}
  .nav button{flex:1}
  .brand-sm{display:block}
  .appname,.demo,.search kbd{display:none}
  .topbar{padding:0 12px;gap:10px}
  .content{padding-bottom:76px}
  .focus,.page{padding:20px 16px 40px}
  .fname{font-size:26px}
  .bring{width:100px;height:100px}
  .prio{gap:14px}
  .top-r{gap:0}
  .bring-c b{font-size:34px}
  .why button{grid-template-columns:18px minmax(0,1fr) 18px}
  .why-m{display:none}
  .met{padding:14px}
  .met-v{font-size:26px}
  .evbar{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .dr-f{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>

<symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.6M12 17.2h.01"/></symbol>

<symbol id="i-export" viewBox="0 0 24 24"><path d="M12 3.5v11M7.5 8 12 3.5 16.5 8"/><path d="M5 13.5v4A2.5 2.5 0 0 0 7.5 20h9a2.5 2.5 0 0 0 2.5-2.5v-4"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M4 6h12M4 12h8M4 18h7M17.5 13.5v7M14 17h7"/></symbol>

<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>

<symbol id="i-chevl" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8h.01"/></symbol>
<symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 21 19.5H3z"/><path d="M12 10v4.5M12 17h.01"/></symbol>
<symbol id="i-okc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m8.2 12.2 2.6 2.6 5-5.2"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M7.5 5.5v13l10.5-6.5z"/></symbol>

<div class="app">
  <aside class="rail" aria-label="Navegación principal">
    <svg class="brand" viewBox="0 0 36 36" role="img" aria-label="Perfil del Reportado"><rect width="36" height="36" rx="10" style="fill:var(--ink)"/><circle cx="18" cy="18" r="10.5" style="fill:none;stroke:var(--bg);stroke-width:1.4;opacity:.45"/><circle cx="18" cy="18" r="5.8" style="fill:none;stroke:var(--bg);stroke-width:1.4;opacity:.8"/><circle cx="18" cy="18" r="2.2" style="fill:#e8792a"/></svg>
    <nav class="nav" id="nav">
      <button data-act="view" data-view="entidades" aria-current="page"><svg class="i" aria-hidden="true"><use href="#i-inbox"/></svg><span>Bandeja</span></button>
      <button data-act="view" data-view="lote"><svg class="i" aria-hidden="true"><use href="#i-list"/></svg><span>Lote</span></button>
      <button data-act="view" data-view="fuentes"><svg class="i" aria-hidden="true"><use href="#i-db"/></svg><span>Fuentes</span><i class="nav-dot" id="navDot" hidden style="--c:var(--high)"></i></button>
    </nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <svg class="brand-sm" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="10" style="fill:var(--ink)"/><circle cx="18" cy="18" r="10.5" style="fill:none;stroke:var(--bg);stroke-width:1.4;opacity:.45"/><circle cx="18" cy="18" r="5.8" style="fill:none;stroke:var(--bg);stroke-width:1.4;opacity:.8"/><circle cx="18" cy="18" r="2.2" style="fill:#e8792a"/></svg>
      <div class="appname">Perfil del Reportado<span>V12 piloto</span></div>
      <button class="search" data-act="palette" aria-label="Buscar por RUT, número de reporte o nombre"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg><span>Buscar RUT, N° de reporte o nombre</span><kbd id="kbdHint">Ctrl K</kbd></button>
      <div class="top-r">
        <div class="corte"><i aria-hidden="true"></i>Corte <b>28-09-2026 06:00</b></div>
        <span class="demo">Datos ficticios</span>
        <button class="icon-btn" data-act="guide" aria-label="Guía del piloto" title="Guía del piloto"><svg class="i" aria-hidden="true"><use href="#i-help"/></svg></button>
        <button class="icon-btn" data-act="theme" id="themeBtn" aria-label="Cambiar tema" title="Cambiar tema"><svg class="i" aria-hidden="true"><use id="themeUse" href="#i-moon"/></svg></button>
      </div>

function parseBatch(text){const lines=text.split(/[\n,;\t]+/).map(s=>s.trim()).filter(Boolean),seen=new Set(),items=[];let dup=0;lines.forEach(raw=>{const c=classify(raw),k=c.kind==='rut'?'r'+c.num:c.kind==='ros'?'o'+c.folio:'x'+raw.toUpperCase();if(seen.has(k)){dup++;return}seen.add(k);items.push(c)});return{lines:lines.length,items,dup,nRut:items.filter(i=>i.kind==='rut').length,nRos:items.filter(i=>i.kind==='ros').length,nBad:items.filter(i=>i.kind==='bad').length}}
function runBatch(){const B=S.batch,P=parseBatch(B.text),rows=new Map(),issues=[],add=(n,o)=>{let r=rows.get(n);if(!r){r={num:n,origins:[]};rows.set(n,r)}if(!r.origins.includes(o))r.origins.push(o)};
  P.items.forEach(it=>{if(it.kind==='bad')issues.push({sev:'med',raw:it.raw,msg:it.msg,fix:it.fix});else if(it.kind==='rut'){ENT.has(it.num)?add(it.num,'RUT'):issues.push({sev:'none',raw:it.raw,msg:'RUT válido sin coincidencias en el universo piloto.'})}else{const r=ROS.get(it.folio);r?r.parts.forEach(([n])=>add(n,'ROS '+it.folio)):issues.push({sev:'none',raw:it.raw,msg:'No existe un reporte con ese número.'})}});
  B.parsed=P;B.rows=[...rows.values()];B.issues=issues;B.processedText=B.text;B.at=new Date();}
function updateParse(){const B=S.batch,P=parseBatch(B.text),dirty=B.processedText!=null&&B.processedText!==B.text;
  $('#bParse').innerHTML=P.lines?`<span class="tag">${P.lines} líneas</span><span class="tag">${P.items.length} únicas</span>${P.nRut?`<span class="tag">${P.nRut} RUT</span>`:''}${P.nRos?`<span class="tag">${P.nRos} reportes</span>`:''}${P.nBad?`<span class="tag hi">${P.nBad} por corregir</span>`:''}${P.dup?`<span class="tag">${P.dup} duplicada${P.dup>1?'s':''}</span>`:''}${dirty?'<span class="tag ac">Cambios sin procesar</span>':''}`:'<span class="tag">Sin claves</span>';
  $('#bIssues').innerHTML=B.issues.length?`<div class="issues"><span class="label">Incidencias · ${B.issues.length}</span><ul style="margin-top:8px">${B.issues.map(x=>`<li>${glyph(x.sev,10)}<span class="mono" style="font-weight:600">${esc(x.raw)}</span><p>${esc(x.msg)}</p>${x.fix?`<button class="btn btn-sm" data-act="bfix" data-raw="${esc(x.raw)}" data-fix="${esc(x.fix)}">Usar ${esc(x.fix)}</button>`:''}</li>`).join('')}</ul></div>`:''}
function renderBatchOut(){const B=S.batch,o=$('#bOut');if(!B.processedText){o.innerHTML='<div class="empty"><span class="sg nohit"></span><span>Pega RUT o números de reporte y pulsa Procesar.</span></div>';return}
  const rows=B.rows.map(r=>({...r,p:profile(r.num)})).sort((a,b)=>b.p.score-a.p.score),counts=SEVS.map(k=>[k,rows.filter(r=>r.p.level===k).length]).filter(c=>c[1]),tot=rows.length||1,cell=(p,cat,v)=>{const s=maxSev(p.alerts.filter(a=>a.cat===cat));return`<td><span class="hm${s?'':' z'}" style="--c:var(--${s||'ink-4'})">${s?glyph(s,9):''}${v}</span></td>`};
  o.innerHTML=`<div class="bsum"><div><span>Entradas</span><b>${B.parsed.lines}</b></div><div><span>Entidades</span><b>${rows.length}</b></div><div><span>Requieren atención</span><b>${rows.filter(r=>SEV[r.p.level].r>=3).length}</b></div><div><span>Incidencias</span><b>${B.issues.length}</b></div></div>
  <div style="margin-bottom:18px"><div class="dbar" style="height:8px">${counts.map(([k,n])=>`<i style="--c:var(--${k});flex:${n/tot}"></i>`).join('')}</div><div class="legend" style="margin-top:8px">${counts.map(([k,n])=>`<span>${glyph(k,9)}${SEV[k].l} ${n}</span>`).join('')}</div></div>
  <div class="bact" style="justify-content:space-between;margin-bottom:12px"><button class="btn btn-primary" data-act="to-tray">Revisar en la bandeja ${I('arrow')}</button><button class="btn" data-act="bexport">${I('export')}Exportar CSV</button></div>
  <div class="tblwrap"><table class="tbl"><thead><tr><th>Prioridad</th><th>Entidad</th><th>ROS</th><th>Causas</th><th>Vínculos</th><th>Tributario</th><th>Origen</th></tr></thead><tbody>${rows.map(({p,origins})=>{const nR=p.ros.filter(x=>x.role==='R').length,s=p.tax&&p.tax.series;return`<tr data-act="brow" data-num="${p.num}" tabindex="0"><td><span style="display:inline-flex;align-items:center;gap:10px">${mring(p)}${sevLabel(p.level)}</span></td><td><b style="font-weight:600">${esc(tc(p.name))}</b><span class="sub mono">${p.rut}</span></td>${cell(p,'ros',p.ros.length?`${nR}R · ${p.ros.length-nR}V`:'—')}${cell(p,'jud',p.cases.length||'—')}${cell(p,'red',p.rels.length||'—')}${cell(p,'tax',s?(p.tax.end?'Término de giro':pct(s.at(-1)[1]/s[0][1]-1)):'—')}<td class="muted" style="font-size:12px">${origins.join(' + ')}</td></tr>`}).join('')}</tbody></table></div>`}
function renderLote(){$('#v-lote').innerHTML=`<div class="page"><div class="page-h"><span class="label">Procesamiento por lotes</span><h1>Búsqueda masiva</h1><p>Pega RUT o números de reporte. Se valida el dígito verificador, se eliminan duplicados y cada reporte se expande a sus participantes. El resultado se revisa en la bandeja, en orden de prioridad.</p></div>
  <div class="lote"><div><label class="label" for="bInput" style="display:block;margin-bottom:8px">Claves, una por línea</label><textarea id="bInput" spellcheck="false" autocomplete="off"></textarea><div class="bparse" id="bParse" aria-live="polite"></div><div class="bact"><button class="btn btn-primary" data-act="brun">${I('play')}Procesar</button><button class="btn" data-act="bexample">Ejemplo</button><button class="btn btn-ghost" data-act="bclear">Limpiar</button></div><div id="bIssues"></div></div><div id="bOut"></div></div></div>`;
  const ta=$('#bInput');ta.value=S.batch.text;ta.addEventListener('input',()=>{S.batch.text=ta.value;updateParse()});updateParse();renderBatchOut()}
function batchCSV(){const q=v=>{const s=String(v??'');return/[;"\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s};return[['rut','nombre','prioridad','nivel','ros','causas','vinculos','estado_tributario','alerta_principal','origen'].join(';'),...S.batch.rows.map(r=>{const p=profile(r.num);return[p.rut,tc(p.name),p.score,SEV[p.level].l,p.ros.length,p.cases.length,p.rels.length,p.tax?p.tax.status:'Sin registro',p.alerts[0]?p.alerts[0].title:'',r.origins.join(' + ')].map(q).join(';')})].join('\n')}

/* ───────── fuentes */
function renderFuentes(){$('#v-fuentes').innerHTML=`<div class="page"><div class="page-h"><span class="label">Trazabilidad</span><h1>Estado de fuentes</h1><p>Antigüedad de cada corte respecto del 28-09-2026. La marca vertical indica el plazo comprometido.</p></div>
  <div class="src-grid">${SOURCES.map(s=>{const f=freshness(s),w=f.age==null?0:Math.min(100,f.age/(s.sla*1.25)*100),c=f.k==='ok'?'ok':f.k;return`<article class="card src"><header><div><h3>${s.name}</h3><p>${esc(s.owner)}</p></div><span class="sev" style="--c:var(--${c})">${f.k==='ok'?I('check'):glyph(f.k,9)}${f.l}</span></header>${s.offline?'<p>La suite opera sin red: en cada perfil figura como <b>no consultada</b>, nunca como «sin registro».</p>':`<div><div class="fresh" role="img" aria-label="${f.age} días, plazo ${s.sla}"><i style="width:${w.toFixed(1)}%;--c:var(--${c})"></i><span class="sla" style="left:80%"></span></div><div class="fresh-m"><span>Corte ${fmtD(s.cut)}</span><span>${f.age} día${f.age===1?'':'s'} · plazo ${s.sla}</span></div></div>`}</article>`}).join('')}</div></div>`}

/* ───────── vistas y eventos */
function setView(v){S.view=v;['entidades','lote','fuentes'].forEach(x=>$('#v-'+x).hidden=x!==v);$$('#nav button').forEach(b=>b.dataset.view===v?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));applyEvidence();try{history.replaceState(null,'','#'+v)}catch(e){}}
function setThemeIcon(){const dark=(document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))==='dark';$('#themeUse').setAttribute('href',dark?'#i-sun':'#i-moon');$('#themeBtn').setAttribute('aria-label',dark?'Cambiar a tema claro':'Cambiar a tema oscuro')}
document.addEventListener('click',e=>{
  if(e.target.classList&&e.target.classList.contains('overlay')){closeLayers();return}
  const pi=e.target.closest('[data-pi]');if(pi){palPick(+pi.dataset.pi);return}
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,d=t.dataset;
  switch(a){
    case'view':setView(d.view);window.scrollTo({top:0});if(d.view==='entidades')requestAnimationFrame(moveInk);break;
    case'palette':openPalette();break;
    case'guide':openGuide();break;
    case'theme':{const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),nx=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',nx);store.set('pr12.theme',nx);setThemeIcon();break}
    case'close':closeLayers();break;
    case'try':closeLayers();openPalette(d.q);break;
    case'pick':select(+d.num);break;
    case'back':$('#split').classList.remove('mdetail');window.scrollTo({top:0});break;
    case'src':S.src=d.src;S.filter='all';renderWorklist();{const l=worklist().list;if(l.length&&!l.some(p=>p.num===S.ent))select(l[0].num)}break;
    case'flt':S.filter=d.f;renderWorklist();break;
    case'open-ent':e.stopPropagation();openEntity(+d.num);break;
    case'open-ros':openRos(d.folio);break;
    case'tab':setTab(d.tab,true);break;
    case'goto-ref':{setTab(d.tab,false);const el=$(`#pane [data-ref="${CSS.escape(d.ref)}"]`);if(el){el.classList.add('is-ev');el.scrollIntoView({behavior:reduced()?'auto':'smooth',block:'center'});setTimeout(()=>el.classList.remove('is-ev'),2200)}break}
    case'why':{const al=profile(S.ent).alerts.find(x=>x.id===d.id);if(al)showEvidence(al);break}
    case'more':S.showAll=!S.showAll;renderFocus();break;
    case'clear-ev':S.evidence=null;applyEvidence();redraw($('[data-chart="net"]'));break;
    case'copy':copyText(d.text,`RUT ${d.text} copiado`);break;
    case'export':{const p=profile(S.ent);openSheet('Ficha de la entidad',`${tc(p.name)} · ${p.rut}`,profileText(p),`ficha_${p.rut.replace(/\./g,'')}.txt`);break}
    case'add-batch':{const B=S.batch;if(parseBatch(B.text).items.some(i=>i.kind==='rut'&&i.num===S.ent))toast('Ya está en el lote');else{B.text=(B.text.trim()?B.text.trim()+'\n':'')+fmtRut(S.ent);if($('#bInput'))$('#bInput').value=B.text;updateParse();toast('Agregado al lote')}break}
    case'tl':S.tlRange=d.r;$$('[data-act="tl"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.r===d.r));redraw($('[data-chart="tl"]'));break;
    case'rel-sel':S.relSel=+d.num;redraw($('[data-chart="net"]'));$('#netDetail').innerHTML=netDetail(profile(S.ent));break;
    case'rtype':{const tp=d.t;S.relHide.has(tp)?S.relHide.delete(tp):S.relHide.add(tp);t.setAttribute('aria-pressed',!S.relHide.has(tp));redraw($('[data-chart="net"]'));break}
    case'brun':runBatch();updateParse();renderBatchOut();renderWorklist();toast(`Lote procesado · ${S.batch.rows.length} entidades`);break;
    case'bexample':S.batch.text=EXAMPLE;$('#bInput').value=EXAMPLE;updateParse();break;
    case'bclear':S.batch.text='';$('#bInput').value='';S.batch.processedText=null;S.batch.rows=[];S.batch.issues=[];if(S.src==='lote')S.src='universo';updateParse();renderBatchOut();renderWorklist();$('#bInput').focus();break;
    case'bfix':{const B=S.batch,lines=B.text.split('\n'),i=lines.findIndex(l=>l.trim()===d.raw);if(i>=0){lines[i]=d.fix;B.text=lines.join('\n');$('#bInput').value=B.text;runBatch();updateParse();renderBatchOut();renderWorklist();toast('Corregido a '+d.fix)}break}
    case'to-tray':S.src='lote';S.filter='all';setView('entidades');renderWorklist();{const l=worklist().list;if(l.length)select(l[0].num)}break;
    case'brow':S.src='lote';S.filter='all';setView('entidades');renderWorklist();select(+d.num);break;
    case'bexport':openSheet('Resultados del lote',`${S.batch.rows.length} entidades`,batchCSV(),'perfil_reportado_lote.csv');break;
    case'sh-copy':copyText($('#shText').value,'Contenido copiado');break;
    case'sh-dl':download(d.fn,$('#shText').value);break;
  }
});
document.addEventListener('change',e=>{const id=e.target.dataset&&e.target.dataset.review;if(!id)return;const set=new Set(S.reviewed[S.ent]||[]);e.target.checked?set.add(id):set.delete(id);S.reviewed[S.ent]=[...set];store.set('pr12.reviewed',S.reviewed);e.target.closest('li').classList.toggle('done',e.target.checked);const p=profile(S.ent),h=$('#pane .grid2 .sub-h p');if(h)h.textContent=`${p.alerts.filter(a=>set.has(a.id)).length} de ${p.alerts.length} revisadas`});
$('#palInput').addEventListener('input',()=>{palSel=0;palRender()});
$('#palInput').addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(palList.length){palSel=(palSel+(e.key==='ArrowDown'?1:-1)+palList.length)%palList.length;palRender();$('#po'+palSel)?.scrollIntoView({block:'nearest'})}}else if(e.key==='Enter'){e.preventDefault();palPick(palSel)}});
document.addEventListener('keydown',e=>{
  const ae=document.activeElement,typing=ae&&/^(INPUT|TEXTAREA)$/.test(ae.tagName);
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return}
  if(e.key==='Escape'){if(anyLayer()){e.preventDefault();closeLayers()}else if(S.evidence){S.evidence=null;applyEvidence();redraw($('[data-chart="net"]'))}return}
  if(e.key==='Tab'&&anyLayer()){const box=['#palette','#drawer','#sheet'].map(s=>$(s)).find(x=>!x.hidden),f=$$('button,input,textarea,[tabindex="0"]',box).filter(x=>!x.disabled&&x.offsetParent!==null);if(f.length){if(e.shiftKey&&ae===f[0]){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&ae===f.at(-1)){e.preventDefault();f[0].focus()}}return}
  if(typing||anyLayer()||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='/'){e.preventDefault();openPalette()}
  else if(e.key==='?')openGuide();
  else if((e.key==='j'||e.key==='k')&&S.view==='entidades'){e.preventDefault();stepList(e.key==='j'?1:-1)}
  else if((e.key==='Enter'||e.key===' ')&&ae&&ae.matches('[data-act]:not(button):not(input)')){e.preventDefault();ae.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
});
addEventListener('resize',()=>requestAnimationFrame(moveInk));
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',setThemeIcon);

/* ───────── arranque */
const MAC=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent);
$('#kbdHint').textContent=MAC?'⌘K':'Ctrl K';
const th=store.get('pr12.theme',null);if(th==='dark'||th==='light')document.documentElement.setAttribute('data-theme',th);
setThemeIcon();
runBatch();renderLote();renderFuentes();renderEntidades();
$('#navDot').hidden=!SOURCES.some(s=>!s.offline&&freshness(s).k==='high');$('#navDot').title='Hay fuentes desfasadas';
const h=(location.hash||'').slice(1);setView(['lote','fuentes'].includes(h)?h:'entidades');
if(innerWidth<=900)$('#split').classList.remove('mdetail');
})();
</script>
</body>
</html>
