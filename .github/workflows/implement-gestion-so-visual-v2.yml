name: Implementar rediseño visual Gestión SO v2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_gestion_so_visual_v2.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Aplicar rediseño visual
        run: python3 scripts/patch_gestion_so_visual_v2.py
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Verificar build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE: ${{ vars.VITE_BASE }}
        run: npm run build
      - name: Guardar implementación verificada
        run: |
          git config user.name "Atlas maintenance bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/views/universo/CasosAxis.tsx \
            src/main.tsx \
            src/styles/gestion-so-redesign-v2.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: rediseña Gestión SO con navegación visual"
            git push origin HEAD:main
          fi
