name: Hotfix contact action styles

on:
  push:
    branches: [fix/gestion-so-contact-actions]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gestion-so-contact-actions
      - name: Patch compact contact actions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/styles/universo-contact.css')
          s = p.read_text()
          old = ".uso .uso-open-row-actions { grid-column: 2 / -1; }\n.uso .uso-open-row-actions .uso-open-actions { margin-top: 2px; }"
          new = """.uso .uso-open-row-actions {
            grid-column: 2 / -1;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
            margin-top: 3px;
          }
          .uso .uso-open-row-actions .uso-open-actions { margin-top: 2px; }
          .uso .uso-open-row-actions > button:not(.copy-btn),
          .uso .uso-open-row-actions > a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 24px;
            padding: 3px 7px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: transparent;
            color: var(--ink-3);
            font: inherit;
            font-size: 8px;
            font-weight: 650;
            line-height: 1;
            text-decoration: none;
            white-space: nowrap;
            cursor: pointer;
          }
          .uso .uso-open-row-actions > button:not(.copy-btn):hover,
          .uso .uso-open-row-actions > a:hover {
            border-color: var(--line-strong);
            color: var(--ink);
          }
          .uso .uso-open-row-actions > .uso-open-use {
            border-color: color-mix(in srgb, var(--present) 45%, var(--line));
            background: color-mix(in srgb, var(--present) 6%, transparent);
            color: var(--present);
          }
          .uso .uso-open-row-actions > button:disabled {
            opacity: .45;
            cursor: not-allowed;
          }"""
          if new in s:
              print('Already patched')
          elif old not in s:
              raise SystemExit('Expected CSS anchor not found')
          else:
              p.write_text(s.replace(old, new))
              print('Patched')
          PY
      - name: Commit patch when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/styles/universo-contact.css
          git commit -m "Fix compact contact action buttons"
          git push origin HEAD:fix/gestion-so-contact-actions
