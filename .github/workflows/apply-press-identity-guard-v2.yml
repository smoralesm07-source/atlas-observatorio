name: Aplicar guardia de identidad de prensa v2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_press_identity_guard_v2.py'
      - '.github/workflows/apply-press-identity-guard-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Aplicar guardia conservadora de identidad
        run: python3 scripts/patch_press_identity_guard_v2.py
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Verificar build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_AUTH_REDIRECT_TO: https://atlasobservatorio.app/
        run: npm run build
      - name: Guardar cambio verificado
        run: |
          git config user.name "Atlas maintenance bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/press.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: evita falsos positivos por nombres societarios genéricos"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
