name: Patch ciclo sin grafico duplicado

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-cycle-remove-duplicate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Eliminar gráfico duplicado de Ciclo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/views/pulso/Ciclo.tsx')
          s = p.read_text()
          s = s.replace("import { Empty, ErrorBox, Loading } from '../../components/primitives';", "import { Empty, ErrorBox } from '../../components/primitives';")

          start = '      <div className="pulse-cycle-summary" style={{ gridTemplateColumns: \'1fr\' }}>'
          end = '      <div className="pulse-sector-trends">'
          i = s.find(start)
          j = s.find(end, i)
          if i < 0 or j < 0:
              raise SystemExit('No se encontró el bloque de evolución duplicado')
          s = s[:i] + s[j:]

          start_fn = '\nfunction RegistryChart('
          end_fn = '\nfunction TrendPanel('
          i = s.find(start_fn)
          j = s.find(end_fn, i)
          if i < 0 or j < 0:
              raise SystemExit('No se encontró RegistryChart')
          s = s[:i] + s[j:]

          p.write_text(s)
          PY
      - run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Verificar build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE: ${{ vars.VITE_BASE }}
        run: npm run build
      - name: Guardar cambio
        run: |
          git config user.name 'smoralesm07-source'
          git config user.email 'smoralesm07@gmail.com'
          git add src/views/pulso/Ciclo.tsx
          git commit -m 'fix: elimina evolución duplicada en lente ciclo'
          git pull --rebase origin main
          git push origin HEAD:main
