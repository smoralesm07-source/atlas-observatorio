name: Implementar contacto abierto Universo SO

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_universo_contact.py'
      - '.github/workflows/implement-universo-contact.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Integrar contacto abierto
        run: python3 scripts/patch_universo_contact.py
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Verificar build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE: ${{ vars.VITE_BASE }}
        run: npm run build
      - name: Guardar mejora verificada
        run: |
          git config user.name "Atlas maintenance bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/views/universo/CaseFile.tsx src/views/universo/OpenContactPanel.tsx src/styles/universo-contact.css supabase/migrations/20260910104500_universo_so_contact_osint_read.sql
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: integra contacto abierto en Universo SO"
            git push origin HEAD:main
          fi
