name: Recuperar caché de login ATLAS

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_cache_recovery.py'
      - '.github/workflows/cache-recovery-login.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Aplicar recuperación de caché
        run: python3 scripts/patch_cache_recovery.py
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Verificar build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_AUTH_REDIRECT_TO: https://atlasobservatorio.app/
        run: npm run build
      - name: Verificar login publicado en artefacto local
        run: |
          if grep -Rqs 'Ingresar con Microsoft' dist; then
            echo '::error::El build todavía contiene el botón Microsoft'
            exit 1
          fi
          grep -Rqs 'Correo institucional UAF' dist || { echo '::error::No se encontró el login institucional'; exit 1; }
          test -f dist/sw.js
          test -f dist/service-worker.js
      - name: Guardar cambio verificado
        run: |
          git config user.name "Atlas maintenance bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html public/sw.js public/service-worker.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: fuerza recuperación de caché obsoleta del login"
            git push origin HEAD:main
          fi
