name: Patch Potential SO intake preview

on:
  push:
    branches: [feat/potential-intake-preview-20260912]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/potential-intake-preview-20260912
      - name: Wire preview into CaseFile
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/views/universo/CaseFile.tsx')
          s = p.read_text()

          if "import { PotentialIntakePreview } from './PotentialIntakePreview';" not in s:
              anchor = "import { OpenContactPanel } from './OpenContactPanel';\n"
              if anchor not in s:
                  raise SystemExit('OpenContactPanel import anchor not found')
              s = s.replace(anchor, anchor + "import { PotentialIntakePreview } from './PotentialIntakePreview';\n", 1)

          if "import '../../styles/universo-potential-intake.css';" not in s:
              anchor = "import '../../styles/universo-case-review.css';\n"
              if anchor not in s:
                  raise SystemExit('Case review CSS anchor not found')
              s = s.replace(anchor, anchor + "import '../../styles/universo-potential-intake.css';\n", 1)

          if '<PotentialIntakePreview' not in s:
              pattern = re.compile(
                  r'''      \{!tracked \? \(\n        <div className="uso-case-body uso-case-start">.*?        </div>\n      \) : \(''',
                  re.S,
              )
              replacement = '''      {!tracked ? (\n        row.kind === 'POTENCIAL' ? (\n          <PotentialIntakePreview\n            row={row}\n            onTake={() => onPatch({ state: 'GESTIONANDO', workflowStep: 1, managementResult: null, noContact: false })}\n          />\n        ) : (\n          <div className="uso-case-body uso-case-start">\n            <div className="uso-case-start-copy">\n              <span className="uso-kicker">Disponible para gestión</span>\n              <b>Revisar término de giro</b>\n              <p>{row.subject.motive}</p>\n            </div>\n            <button className="btn btn-primary" onClick={() => onPatch({ state: 'GESTIONANDO', workflowStep: 1, managementResult: null, noContact: false })}>\n              Tomar caso\n            </button>\n          </div>\n        )\n      ) : ('''
              s, count = pattern.subn(replacement, s, count=1)
              if count != 1:
                  raise SystemExit(f'Untracked Potential SO block not found: {count}')

          p.write_text(s)
          PY
      - name: Commit patch when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/views/universo/CaseFile.tsx
          git commit -m "Wire decision preview into Potential SO cases"
          git push origin HEAD:feat/potential-intake-preview-20260912
