name: Normalizar búsqueda RUT en altas

on:
  push:
    paths:
      - '.github/trigger-fix-new-entities-rut-query.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Ajustar búsqueda de RUT
        run: python3 scripts/fix_new_entities_rut_query.py
      - run: npm ci
      - name: Verificar build
        run: npm run build
      - name: Confirmar fix
        run: |
          git config user.name "Atlas maintenance bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/views/pulso/NewEntitiesDirectory.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: normaliza RUT en directorio de altas"
            git push origin HEAD:main
          fi
