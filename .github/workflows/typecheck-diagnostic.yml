name: Typecheck diagnostic

on:
  push:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capturar diagnóstico TypeScript
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          cat typecheck.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostic
          path: typecheck.log
