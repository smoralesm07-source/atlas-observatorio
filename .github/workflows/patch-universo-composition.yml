name: Patch Universo SO composition

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-universo-composition.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply composition fix
        run: python3 scripts/patch_universo_composition.py
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Commit verified fix
        shell: bash
        run: |
          rm -f .github/workflows/patch-universo-composition.yml scripts/patch_universo_composition.py
          git config user.name "Atlas maintenance bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/views/universo/PadronAxis.tsx src/styles/universo-so.css .github/workflows/patch-universo-composition.yml scripts/patch_universo_composition.py
          git commit -m "fix: contextualiza composición del padrón UAF"
          git pull --rebase origin main
          git push origin HEAD:main
