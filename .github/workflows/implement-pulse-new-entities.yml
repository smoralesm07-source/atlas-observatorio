name: Implement pulse new entities

on:
  push:
    paths:
      - '.github/trigger-pulse-new-entities.txt'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Pulso update
        run: python3 scripts/patch_pulse_new_entities.py
      - name: Install dependencies
        run: npm ci
      - name: Verify build
        run: npm run build
      - name: Commit verified implementation
        run: |
          git config user.name "Atlas maintenance bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/views/PulsoV6.tsx src/styles/pulso-new-entities.css supabase/migrations/20260913_obs_new_entities_pulse.sql
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: convierte Pulso en radar de actualizaciones recientes"
            git push origin HEAD:main
          fi
