name: Patch cohort overlay v2

on:
  push:
    paths:
      - '.github/trigger-cohort-overlay-v2.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply floating overlay and quick detail
        run: python3 scripts/patch_cohort_overlay_v2.py
      - name: Install dependencies
        run: npm ci
      - name: Verify build
        run: npm run build
      - name: Commit verified fix
        run: |
          git config user.name "Atlas maintenance bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/CohortDrawer.tsx src/main.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: hace flotante la ficha y compacta detalle de entidades"
            git push origin HEAD:main
          fi
