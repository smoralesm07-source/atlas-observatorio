name: Construir y publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Construir
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_AUTH_REDIRECT_TO: https://atlasobservatorio.app/
        run: |
          if [ -z "${VITE_SUPABASE_URL:-}" ]; then
            echo "::error::Falta la variable de repositorio VITE_SUPABASE_URL"
            exit 1
          fi
          if [ "${VITE_AUTH_REDIRECT_TO}" != "https://atlasobservatorio.app/" ]; then
            echo "::error::El callback de autenticación no apunta al dominio canónico de ATLAS"
            exit 1
          fi
          npx vite build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
