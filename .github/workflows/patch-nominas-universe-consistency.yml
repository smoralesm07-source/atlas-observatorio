name: Conciliar universos de Nóminas

on:
  push:
    branches: [main]
    paths:
      - '.github/trigger-nominas-universe-consistency.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Aplicar conciliación de Nóminas
        run: python3 scripts/patch_nominas_universe_consistency.py
      - run: npm ci
      - name: Verificar tipos y build
        run: npm run build
      - name: Publicar corrección
        run: |
          git config user.name "Atlas maintenance bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/views/NominasV3.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: reconcile Nóminas universe counts"
            git push origin HEAD:main
          fi
