name: TMP Sales band UF labels

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_tmp-sales-band-uf-labels.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply UI change
        run: python .github/scripts/update_sales_band_uf.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit and push
        run: |
          git config user.name "atlas-layout[bot]"
          git config user.email "atlas-layout@users.noreply.github.com"
          git add src/views/EntityExpediente.tsx src/styles/entity-expediente.css
          git commit -m "fix: mostrar evolución tributaria en rangos UF"
          git push origin HEAD:main
