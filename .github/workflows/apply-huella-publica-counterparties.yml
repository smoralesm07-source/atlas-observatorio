name: Aplicar fichas y coherencia Huella pública

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_huella_publica_counterparties.py'
      - 'scripts/fix_huella_publica_patch.py'
      - '.github/workflows/apply-huella-publica-counterparties.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Aplicar cambios de Huella pública
        run: |
          python3 scripts/apply_huella_publica_counterparties.py
          python3 scripts/fix_huella_publica_patch.py
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Verificar build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_AUTH_REDIRECT_TO: https://atlasobservatorio.app/
        run: npm run build
      - name: Guardar cambios verificados
        run: |
          git config user.name "Atlas maintenance bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/views/RelacionEstado.tsx src/views/EntityExpediente.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: conecta fichas de Huella pública y Entidad 360"
            git push origin HEAD:main
          fi
