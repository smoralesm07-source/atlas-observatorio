name: Unificar indicador visible como IPA

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_ipa_unification_v1.py'
      - '.github/workflows/apply-ipa-unification-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Aplicar unificación IPA
        id: apply
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/patch_ipa_unification_v1.py 2>&1 | tee ipa-patch.log
      - name: Guardar diagnóstico si falla
        if: steps.apply.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ipa-patch-diagnostic
          path: ipa-patch.log
          retention-days: 1
      - name: Detener si falló el parche
        if: steps.apply.outcome == 'failure'
        run: exit 1
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Verificar build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_AUTH_REDIRECT_TO: https://atlasobservatorio.app/
        run: npm run build
      - name: Guardar cambio verificado
        run: |
          git config user.name "Atlas maintenance bot"
          git config user.email "actions@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: unifica indicador principal como IPA"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
