name: Patch Gestión SO SII buttons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-case-sii-buttons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar parche
        run: python scripts/patch_case_sii_buttons.py
      - name: Confirmar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/views/universo/CaseFile.tsx src/styles/universo-case-review.css src/lib/osint.ts
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "fix: simplify case review actions and repair SII lookup"
            git push origin HEAD:main
          fi
