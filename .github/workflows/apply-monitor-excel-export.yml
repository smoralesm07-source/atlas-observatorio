name: Apply monitor Excel exports

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-monitor-excel-export.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch monitor exports
        run: python3 scripts/apply_monitor_exports.py

      - name: Validate build
        run: |
          npm ci
          npm run build

      - name: Commit application changes
        run: |
          rm .github/workflows/apply-monitor-excel-export.yml scripts/apply_monitor_exports.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: export filtered monitor universes to Excel"
          git push origin HEAD:main
