name: Territory IGR v1.1 UI patch

on:
  push:
    branches: [feature/territory-igr-v11-compare]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/territory-igr-v11-compare
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar cambio de interfaz
        run: python scripts/patch_territory_igr_v11_ui.py
      - name: Guardar cambio
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add src/views/Territorio.tsx src/styles/territorio-map.css
          git commit -m "feat: expose IGR v1.1 comparison in Territorio"
          git push origin HEAD:feature/territory-igr-v11-compare
