name: Territory IGR v1.1 validation

on:
  push:
    branches: [feature/territory-igr-v11-compare]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Construir
        run: npm run build
