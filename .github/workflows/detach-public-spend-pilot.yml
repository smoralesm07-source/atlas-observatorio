name: Desacoplar Gasto público para piloto

# Ejecuta el desacople verificado del módulo de gasto para el piloto.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/detach_public_spend_pilot.py'
      - '.github/workflows/detach-public-spend-pilot.yml'

permissions:
  contents: write

jobs:
  detach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Aplicar alcance del piloto
        run: python3 scripts/detach_public_spend_pilot.py
      - name: Ajustar firma de resumen Entidad 360
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/views/EntityExpediente.tsx')
          text = p.read_text(encoding='utf-8')
          old = "function ResumenTab({ data, press, articles, timeline, activities, history, purchase, registry, onNavigate }: {"
          new = "function ResumenTab({ data, press, articles, timeline, activities, history, purchase, registry }: {"
          if old not in text:
              raise SystemExit('No se encontró la firma esperada de ResumenTab')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Verificar build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_AUTH_REDIRECT_TO: https://atlasobservatorio.app/
        run: npm run build
      - name: Guardar piloto verificado
        run: |
          git config user.name "Atlas maintenance bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx src/components/Shell.tsx src/components/Entity360StatusMarks.tsx src/lib/router.ts src/views/EntityExpediente.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: desacopla Gasto público del piloto Atlas"
            git push origin HEAD:main
          fi
