name: Incorporar señal Potencial SO en Entidades

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/implement-entities-potential-so-signal.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Incorporar señal Potencial SO
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/views/Entidades.tsx')
          source = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              source = source.replace(old, new, 1)

          replace_once(
              "import { n } from '../lib/format';\n",
              "import { n } from '../lib/format';\nimport '../styles/entities-potential-so.css';\n",
              'style import',
          )

          replace_once(
              "  is_uaf_observed?: boolean;\n  is_sanctioned?: boolean;\n",
              "  is_uaf_observed?: boolean;\n  is_sanctioned?: boolean;\n  is_uaf_registered?: boolean;\n  is_potential_screening?: boolean;\n  uaf_universe_status?: string | null;\n  management_bucket?: string | null;\n  potential_uaf_sector?: string | null;\n  uaf_status_basis?: string | null;\n  uaf_status_refreshed_at?: string | null;\n",
              'search item UAF status fields',
          )

          replace_once(
              "              {item.is_uaf_observed && <span className=\"entity-mini-tag uaf\">UAF</span>}\n              {item.is_sanctioned && <span className=\"entity-mini-tag sanction\">sanción</span>}\n",
              "              {item.is_uaf_observed && <span className=\"entity-mini-tag uaf\">UAF</span>}\n              {item.is_potential_screening && item.is_uaf_registered !== true && item.is_uaf_observed !== true && (\n                <span\n                  className=\"entity-mini-tag potential-so\"\n                  title={item.potential_uaf_sector\n                    ? `Potencial SO · sector sugerido: ${item.potential_uaf_sector}`\n                    : item.uaf_status_basis ?? 'Potencial SO según screening SII ↔ UAF'}\n                >\n                  Potencial SO\n                </span>\n              )}\n              {item.is_sanctioned && <span className=\"entity-mini-tag sanction\">sanción</span>}\n",
              'candidate potential badge',
          )

          path.write_text(source, encoding='utf-8')

          css = Path('src/styles/entities-potential-so.css')
          css.write_text("""/* Entidades · señal regulatoria compacta de potencial SO. */
.entity-mini-tag.potential-so {
  color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 48%, var(--line));
  background: color-mix(in srgb, var(--accent) 9%, var(--bg-panel-2));
  font-size: 9.5px;
  font-weight: 800;
  text-transform: none;
  letter-spacing: .025em;
}

.entity-candidate-card:hover .entity-mini-tag.potential-so {
  border-color: color-mix(in srgb, var(--accent) 68%, var(--line-strong));
  background: color-mix(in srgb, var(--accent) 13%, var(--bg-panel-2));
}
""", encoding='utf-8')
          PY
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Verificar build
        run: npm run build
      - name: Guardar cambio verificado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/implement-entities-potential-so-signal.yml
          git add src/views/Entidades.tsx src/styles/entities-potential-so.css .github/workflows/implement-entities-potential-so-signal.yml
          git commit -m "feat: muestra señal Potencial SO en Entidades"
          git push origin HEAD:main
