name: Restringir Gasto público a administradores

on:
  push:
    branches: [main]
    paths:
      - 'scripts/restrict_public_spend_access.py'
      - '.github/workflows/restrict-public-spend-access.yml'

permissions:
  contents: write

jobs:
  restrict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Aplicar restricción por rol
        run: python3 scripts/restrict_public_spend_access.py
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Verificar build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE: ${{ vars.VITE_BASE }}
        run: npm run build
      - name: Guardar restricción verificada
        run: |
          git config user.name "Atlas maintenance bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx src/components/Shell.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: restringe Gasto público a administradores"
            git push origin HEAD:main
          fi
