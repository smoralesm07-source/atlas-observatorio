name: Patch Termination SO intake preview

on:
  push:
    branches: [feat/termination-intake-news-20260912]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/termination-intake-news-20260912
      - name: Wire Termination preview into CaseFile
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/views/universo/CaseFile.tsx')
          s = p.read_text()

          if "import { TerminationIntakePreview } from './TerminationIntakePreview';" not in s:
              anchor = "import { PotentialIntakePreview } from './PotentialIntakePreview';\n"
              if anchor not in s:
                  raise SystemExit('PotentialIntakePreview import anchor not found')
              s = s.replace(anchor, anchor + "import { TerminationIntakePreview } from './TerminationIntakePreview';\n", 1)

          old_section = '<section className="uso-case uso-case-progressive uso-case-two-step" aria-label={`Ficha de gestión de ${row.subject.name || dotted}`}> '
          if old_section in s:
              s = s.replace(old_section, '<section className={`uso-case uso-case-progressive uso-case-two-step uso-case-${row.kind.toLowerCase()}`} aria-label={`Ficha de gestión de ${row.subject.name || dotted}`}> ', 1)
          else:
              s = s.replace(
                  '<section className="uso-case uso-case-progressive uso-case-two-step" aria-label={`Ficha de gestión de ${row.subject.name || dotted}`}>',
                  '<section className={`uso-case uso-case-progressive uso-case-two-step uso-case-${row.kind.toLowerCase()}`} aria-label={`Ficha de gestión de ${row.subject.name || dotted}`}>',
                  1,
              )

          old = '''        ) : (\n          <div className="uso-case-body uso-case-start">\n            <div className="uso-case-start-copy">\n              <span className="uso-kicker">Disponible para gestión</span>\n              <b>Revisar término de giro</b>\n              <p>{row.subject.motive}</p>\n            </div>\n            <button className="btn btn-primary" onClick={() => onPatch({ state: 'GESTIONANDO', workflowStep: 1, managementResult: null, noContact: false })}>\n              Tomar caso\n            </button>\n          </div>\n        )'''
          new = '''        ) : (\n          <TerminationIntakePreview\n            row={row}\n            onTake={() => onPatch({ state: 'GESTIONANDO', workflowStep: 1, managementResult: null, noContact: false })}\n          />\n        )'''

          if '<TerminationIntakePreview' not in s:
              if old not in s:
                  raise SystemExit('Termination untracked block anchor not found')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit patch when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/views/universo/CaseFile.tsx
          git commit -m "Wire Termination decision preview into case flow"
          git push origin HEAD:feat/termination-intake-news-20260912
