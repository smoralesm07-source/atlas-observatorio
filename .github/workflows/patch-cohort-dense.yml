name: Patch cohort dense list

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-cohort-dense.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply dense cohort list
        run: python3 scripts/patch_cohort_dense.py
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Commit verified fix
        shell: bash
        run: |
          rm -f .github/workflows/patch-cohort-dense.yml scripts/patch_cohort_dense.py
          git config user.name "Atlas maintenance bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/CohortDrawer.tsx src/styles/cohort-dense.css src/main.tsx .github/workflows/patch-cohort-dense.yml scripts/patch_cohort_dense.py
          git commit -m "fix: compacta listados de entidades en cohortes"
          git pull --rebase origin main
          git push origin HEAD:main
