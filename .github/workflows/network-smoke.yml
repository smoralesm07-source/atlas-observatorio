name: Diagnostico de red ATLAS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/network-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: DNS TLS HTTP
        shell: bash
        run: |
          set -uo pipefail
          echo '=== DNS ==='
          getent ahosts atlasobservatorio.app || true
          echo
          echo '=== HTTPS HEAD ==='
          curl -4 -IvsS --connect-timeout 10 --max-time 20 https://atlasobservatorio.app/ 2>&1 || true
          echo
          echo '=== TLS ==='
          echo | openssl s_client -connect atlasobservatorio.app:443 -servername atlasobservatorio.app -brief 2>&1 || true
          echo
          echo '=== BODY MARKER ==='
          curl -4 -fsS --connect-timeout 10 --max-time 20 https://atlasobservatorio.app/ | head -c 500 || true
          echo
