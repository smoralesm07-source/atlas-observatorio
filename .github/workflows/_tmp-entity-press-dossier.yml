name: TMP Implementar expediente de prensa Entidad 360

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-entity-press-dossier.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implementar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Descargar Atlas
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Aplicar integración
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: se esperaba 1 coincidencia y hay {count}')
              return text.replace(old, new, 1)

          press_path = Path('src/lib/press.ts')
          press = press_path.read_text(encoding='utf-8')
          press = once(press,
              "  articleById: Map<string, PressArticle>,\n  generatedAt: string | null,\n): PressMatch {",
              "  articleById: Map<string, PressArticle>,\n  generatedAt: string | null,\n  articleLimit = 6,\n): PressMatch {",
              'indexedMatch')
          press = once(press,
              "  articles: Array<{ article: PressArticle; score: number }>,\n  generatedAt: string | null,\n): PressMatch {",
              "  articles: Array<{ article: PressArticle; score: number }>,\n  generatedAt: string | null,\n  articleLimit = 6,\n): PressMatch {",
              'articleFallbackMatch')
          press = once(press,
              "  excludedArticleIds: Set<string>,\n  generatedAt: string | null,\n): PressMatch | null {",
              "  excludedArticleIds: Set<string>,\n  generatedAt: string | null,\n  articleLimit = 6,\n): PressMatch | null {",
              'groupContextMatch')
          if press.count('.slice(0, 6);') != 2:
              raise SystemExit('No se encontraron los dos limites historicos esperados')
          press = press.replace('.slice(0, 6);', '.slice(0, articleLimit);')
          press = once(press,
              "  const articles = allHits.slice(0, 6).map<PressArticleMatch>((article) => {",
              "  const articles = allHits.slice(0, articleLimit).map<PressArticleMatch>((article) => {",
              'group slice')
          press = once(press,
              "export async function searchPress(query: string, limit = 12): Promise<PressMatch[]> {",
              "export async function searchPress(query: string, limit = 12, articleLimit = 6): Promise<PressMatch[]> {",
              'searchPress signature')
          press = once(press,
              "  const maxResults = Math.max(1, Math.min(limit, 30));\n",
              "  const maxResults = Math.max(1, Math.min(limit, 30));\n  const maxArticles = Math.max(1, Math.min(articleLimit, 250));\n",
              'maxArticles')
          press = once(press,
              "      articleById,\n      bridge.generated_at ?? null,\n    ));",
              "      articleById,\n      bridge.generated_at ?? null,\n      maxArticles,\n    ));",
              'indexed call')
          press = once(press,
              "    ? [articleFallbackMatch(query, queryText, directArticleHits, bridge.generated_at ?? null), ...indexed]",
              "    ? [articleFallbackMatch(query, queryText, directArticleHits, bridge.generated_at ?? null, maxArticles), ...indexed]",
              'fallback call')
          press = once(press,
              "    coveredArticleIds,\n    bridge.generated_at ?? null,\n  );",
              "    coveredArticleIds,\n    bridge.generated_at ?? null,\n    maxArticles,\n  );",
              'group call')
          press = once(press,
              "    : baseMatches.slice(0, maxResults);\n}\n\n\n/* ── Prensa por comuna",
              "    : baseMatches.slice(0, maxResults);\n}\n\nexport async function searchPressDossier(query: string, limit = 12): Promise<PressMatch[]> {\n  return searchPress(query, limit, 120);\n}\n\n\n/* ── Prensa por comuna",
              'dossier export')
          press_path.write_text(press, encoding='utf-8')

          entity_path = Path('src/views/EntityExpediente.tsx')
          entity = entity_path.read_text(encoding='utf-8')
          entity = once(entity,
              "import { Badge, Empty, ErrorBox, Loading } from '../components/primitives';\n",
              "import { Badge, Empty, ErrorBox, Loading } from '../components/primitives';\nimport { EntityPressDossier } from '../components/EntityPressDossier';\n",
              'component import')
          entity = once(entity,
              "import { searchPress, type PressMatch } from '../lib/press';",
              "import { searchPressDossier, type PressMatch } from '../lib/press';",
              'press import')
          entity = once(entity,
              "type Tab = 'resumen' | 'tributario' | 'uaf' | 'sanciones' | 'registros' | 'historico' | 'fuentes';",
              "type Tab = 'resumen' | 'tributario' | 'uaf' | 'sanciones' | 'prensa' | 'registros' | 'historico' | 'fuentes';",
              'tab type')
          entity = once(entity,
              "  { id: 'sanciones', label: 'Sanciones' },\n  { id: 'registros', label: 'OSFL / RES' },",
              "  { id: 'sanciones', label: 'Sanciones' },\n  { id: 'prensa', label: 'Prensa' },\n  { id: 'registros', label: 'OSFL / RES' },",
              'tab list')
          entity = once(entity,
              "function strictPressMatches(entity: EntityDetail['entity'], matches: PressMatch[]): PressMatch[] {\n  const rut = compactRut(entity.rut);\n  if (rut) {\n    const byRut = matches.filter((match) => match.ruts.some((candidate) => compactRut(candidate) === rut));\n    if (byRut.length) return byRut;\n  }\n  return matches.filter((match) => match.match_score >= 0.94);\n}",
              "function strictPressMatches(entity: EntityDetail['entity'], matches: PressMatch[]): PressMatch[] {\n  const rut = compactRut(entity.rut);\n  const strongName = matches.filter((match) => match.match_score >= 0.94);\n  if (!rut) return strongName;\n  const byRut = matches.filter((match) => match.ruts.some((candidate) => compactRut(candidate) === rut));\n  const seen = new Set(byRut.map((match) => match.press_entity_id));\n  return [...byRut, ...strongName.filter((match) => !seen.has(match.press_entity_id))];\n}",
              'strict matches')
          entity = once(entity,
              "        let matches = await searchPress(entity.rut ?? entity.name, 10);\n        matches = strictPressMatches(entity, matches);\n        if (!matches.length && entity.rut) matches = strictPressMatches(entity, await searchPress(entity.name, 10));",
              "        let matches = strictPressMatches(entity, await searchPressDossier(entity.name, 10));\n        if (!matches.length && entity.rut) matches = strictPressMatches(entity, await searchPressDossier(entity.rut, 10));",
              'press query')
          entity = once(entity,
              "    sanciones: sanctionCoverage?.status === 'PRESENT' || data.sanctions.length > 0,\n    registros:",
              "    sanciones: sanctionCoverage?.status === 'PRESENT' || data.sanctions.length > 0,\n    prensa: articles.length > 0 || pressCoverage?.status === 'PRESENT',\n    registros:",
              'tab data')
          entity = once(entity,
              "      {tab === 'sanciones' && <SancionesTab data={data} />}\n      {tab === 'registros'",
              "      {tab === 'sanciones' && <SancionesTab data={data} />}\n      {tab === 'prensa' && <EntityPressDossier entityName={entity.name} status={press.status} matches={press.matches} error={press.error} />}\n      {tab === 'registros'",
              'tab render')
          entity_path.write_text(entity, encoding='utf-8')

          main_path = Path('src/main.tsx')
          main = main_path.read_text(encoding='utf-8')
          main = once(main,
              "import './styles/entity360-light-contrast-v2.css';\n",
              "import './styles/entity360-light-contrast-v2.css';\nimport './styles/entity360-press-dossier.css';\n",
              'css import')
          main_path.write_text(main, encoding='utf-8')
          PY

      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci; else npm install --ignore-scripts; fi

      - name: Validar TypeScript y build
        run: npm run build

      - name: Publicar cambio
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "atlas-entity-press[bot]"
          git config user.email "atlas-entity-press@users.noreply.github.com"
          git add src/lib/press.ts src/views/EntityExpediente.tsx src/main.tsx
          git commit -m "feat: integrar expediente de prensa en Entidad 360"
          git push origin HEAD:main
