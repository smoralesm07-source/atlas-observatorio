name: Corregir navegación Entidad 360 a Gestión SO

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-entity360-gestion-rut.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Normalizar búsqueda por RUT en Gestión SO
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/views/universo/CasosAxis.tsx')
          source = path.read_text(encoding='utf-8')
          old = """  const rows = useMemo(() => {\n    const q = query.trim().toLowerCase();\n    const filtered = queueRows.filter((row) => {\n      if (q && !row.haystack.includes(q)) return false;\n"""
          new = """  const rows = useMemo(() => {\n    const q = query.trim().toLowerCase();\n    const qRut = contactRutKey(query);\n    const filtered = queueRows.filter((row) => {\n      const rutMatch = qRut.length >= 7 && contactRutKey(row.subject.rut).includes(qRut);\n      if (q && !row.haystack.includes(q) && !rutMatch) return false;\n"""
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'Filtro de búsqueda: se esperaba 1 coincidencia, encontradas {count}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Verificar build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_AUTH_REDIRECT_TO: https://atlasobservatorio.app/
        run: npx vite build
      - name: Guardar corrección verificada
        run: |
          rm .github/workflows/fix-entity360-gestion-rut.yml
          git config user.name "Atlas maintenance bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/views/universo/CasosAxis.tsx .github/workflows/fix-entity360-gestion-rut.yml
          git commit -m "fix: mantiene identidad entre Entidad 360 y Gestión SO"
          git push origin HEAD:main
