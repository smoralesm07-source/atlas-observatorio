name: Territorio IGR score + percentile

on:
  push:
    branches: [feat/territorio-igr-percentile-primary]
    paths:
      - 'scripts/patch_territorio_igr_percentile_primary.py'
      - '.github/workflows/territorio-igr-percentile-primary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/territorio-igr-percentile-primary
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Aplicar lectura score + percentil
        run: python scripts/patch_territorio_igr_percentile_primary.py

      - name: Verificar tipos
        run: npm run typecheck

      - name: Construir
        run: npm run build

      - name: Guardar cambio validado
        shell: bash
        run: |
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add src/views/Territorio.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Territorio: score y percentil RC1 como lectura primaria"
            git push origin HEAD:feat/territorio-igr-percentile-primary
          fi
