name: Aplicar señal Potencial SO en Entidades

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_entities_potential_so.py'
      - '.github/workflows/apply-entities-potential-so.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Aplicar señal Potencial SO
        run: python3 scripts/patch_entities_potential_so.py
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Verificar build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE: ${{ vars.VITE_BASE }}
        run: npm run build
      - name: Guardar implementación verificada
        run: |
          git config user.name "Atlas maintenance bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/views/Entidades.tsx src/styles/entities-potential-so.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: muestra señal Potencial SO en Entidades"
            git push origin HEAD:main
          fi
