name: Territorio IGR RC1 patch

on:
  push:
    branches: [feat/territorio-igr-v11-rc1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/territorio-igr-v11-rc1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Aplicar texto RC1
        run: python scripts/patch_territorio_igr_rc1.py

      - name: Verificar tipos
        run: npm run typecheck

      - name: Construir
        run: npm run build

      - name: Guardar cambio
        shell: bash
        run: |
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add src/views/Territorio.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Territorio: presenta IGR v1.1 RC1 y confianza corregida"
            git push origin HEAD:feat/territorio-igr-v11-rc1
          fi
