name: Alinear autenticación OTP 8 dígitos

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_auth_otp_8.py'
      - '.github/workflows/enforce-auth-otp-8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Aplicar OTP de 8 dígitos
        run: python3 scripts/patch_auth_otp_8.py
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Verificar build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_AUTH_REDIRECT_TO: https://atlasobservatorio.app/
        run: npm run build
      - name: Guardar cambio verificado
        run: |
          git config user.name "Atlas maintenance bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/Auth.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: usa OTP de 8 dígitos en autenticación"
            git push origin HEAD:main
          fi
