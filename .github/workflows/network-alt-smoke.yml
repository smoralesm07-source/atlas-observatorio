name: Diagnostico URL alternativa ATLAS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/network-alt-smoke.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probar URL GitHub Pages
        shell: bash
        run: |
          set -uo pipefail
          echo '=== custom ==='
          curl -IvsS --connect-timeout 10 --max-time 20 https://atlasobservatorio.app/ 2>&1 || true
          echo '=== github.io ==='
          curl -IvsS --connect-timeout 10 --max-time 20 https://smoralesm07-source.github.io/atlas-observatorio/ 2>&1 || true
