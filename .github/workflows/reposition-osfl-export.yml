name: Reposition OSFL export button

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reposition-osfl-export.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply UI adjustment
        run: python3 scripts/reposition_osfl_export.py

      - name: Validate build
        run: |
          npm ci
          npm run build

      - name: Commit UI adjustment
        run: |
          rm .github/workflows/reposition-osfl-export.yml scripts/reposition_osfl_export.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(osfl): move export below pagination and style orange"
          git push origin HEAD:main
