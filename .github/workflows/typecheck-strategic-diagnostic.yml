name: Strategic report typecheck diagnostic
on:
  push:
    branches: [main]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture TypeScript diagnostics
        shell: bash
        run: |
          set +e
          npm run typecheck > strategic-typecheck.log 2>&1
          cat strategic-typecheck.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: strategic-typecheck
          path: strategic-typecheck.log
