name: TMP Resiliencia consultas Entidades

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-entity-search-resilience.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Ajustar reintentos de Entidades
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/rpc.ts')
          s = p.read_text()

          old = """  if (fn === 'obs_entity_detail' && isTransientRpcError(err)) {\n    return 'Atlas no recibió una respuesta estable de la base de datos después de varios intentos automáticos. La entidad sigue seleccionada; puedes reintentar sin volver a buscarla.';\n  }\n  if (isStatementTimeout(err)) {\n"""
          new = """  if (fn === 'obs_entity_detail' && isTransientRpcError(err)) {\n    return 'Atlas no recibió una respuesta estable de la base de datos después de varios intentos automáticos. La entidad sigue seleccionada; puedes reintentar sin volver a buscarla.';\n  }\n  if ((fn === 'atlas_v2_entity_search' || fn === 'atlas_v2_entity_search_cascade') && isTransientRpcError(err)) {\n    return 'Atlas no pudo completar esta consulta después de dos intentos automáticos. Puedes reintentar; si persiste, combina filtros para acotar el universo.';\n  }\n  if (isStatementTimeout(err)) {\n"""
          if old not in s:
              raise SystemExit('No se encontró el bloque de mensajes RPC esperado')
          s = s.replace(old, new, 1)

          old = """    const resilientEntityDetail = fn === 'obs_entity_detail';\n    const maxAttempts = resilientEntityDetail ? 3 : 1;\n"""
          new = """    const resilientEntityDetail = fn === 'obs_entity_detail';\n    const resilientEntitySearch = fn === 'atlas_v2_entity_search' || fn === 'atlas_v2_entity_search_cascade';\n    const retryEnabled = resilientEntityDetail || resilientEntitySearch;\n    const maxAttempts = resilientEntityDetail ? 3 : resilientEntitySearch ? 2 : 1;\n"""
          if old not in s:
              raise SystemExit('No se encontró el bloque de política de reintentos esperado')
          s = s.replace(old, new, 1)

          old = """      if (!resilientEntityDetail || !isTransientRpcError(cause) || attempt + 1 >= maxAttempts) {\n"""
          new = """      if (!retryEnabled || !isTransientRpcError(cause) || attempt + 1 >= maxAttempts) {\n"""
          if old not in s:
              raise SystemExit('No se encontró la condición de reintento esperada')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_AUTH_REDIRECT_TO: https://atlasobservatorio.app/
        run: npm run build
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "atlas-resilience[bot]"
          git config user.email "atlas-resilience@users.noreply.github.com"
          git add src/lib/rpc.ts
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: tolerar consultas lentas en Entidades"
            git push origin HEAD:main
          fi
